name: 'Setup Rust toolchain (rust-toolchain.toml-aware)'
description: >-
  Installs the Rust toolchain pinned by the workspace's
  `rust-toolchain.toml`, with optional `targets:` / `components:`
  forwarded to `dtolnay/rust-toolchain`. Solves the workspace-wide
  drift between `rust-toolchain.toml` and CI jobs that previously
  used `@stable` (bypassing the pin) or `@master` with a hard-
  coded version (duplicating the pin).

# Hoists what wasm + coverage jobs were already doing (hard-coding
# `toolchain:` inline to match rust-toolchain.toml) into a single
# place that READS the pin instead of duplicating its value.
# Bumping rust-toolchain.toml's channel becomes a one-line change
# for every job that follows the workspace pin.
#
# `channel-override:` exists for jobs that intentionally diverge
# from the workspace pin: miri (needs nightly), fuzz (libfuzzer-sys
# needs a specific nightly date for sanitizer features). Those
# remain explicit at their use sites — the override is the
# deviation signal.

inputs:
  channel-override:
    description: >-
      Override the channel from rust-toolchain.toml. Use only when
      a job needs a different channel than the workspace pin
      (miri → `nightly`). Leave empty to use the file's pin.
      IMPORTANT: when set, the toolchain file's `components` are
      ALSO ignored (components are channel-tied — the override
      channel doesn't share components context with the file).
      Only `inputs.components` flows through.
    required: false
    default: ''
  toolchain-file:
    description: >-
      Path (relative to repo root) of the `rust-toolchain.toml`
      to read the channel from. Defaults to the workspace root's
      file. Set to `crates/rubyrs/fuzz/rust-toolchain.toml` for the
      fuzz crate (detached sub-workspace with its own pin).
      Ignored if `channel-override:` is set.
    required: false
    default: 'rust-toolchain.toml'
  targets:
    description: >-
      Comma-separated cross-compile targets to install
      (e.g. `wasm32-wasip1`). Forwarded to
      `dtolnay/rust-toolchain` verbatim.
    required: false
    default: ''
  components:
    description: >-
      Comma-separated extra rustup components beyond what
      rust-toolchain.toml declares (e.g. `llvm-tools-preview` for
      the coverage job's instrumented build). Forwarded to
      `dtolnay/rust-toolchain` verbatim.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Resolve channel + components from toolchain file
      id: resolve
      shell: bash
      env:
        OVERRIDE: ${{ inputs.channel-override }}
        TOOLCHAIN_FILE: ${{ inputs.toolchain-file }}
        INPUT_COMPONENTS: ${{ inputs.components }}
      run: |
        # Override path: caller intentionally diverges from the
        # file's pin. Used by miri (nightly). When overriding, we
        # also IGNORE the file's components — components are tied
        # to a channel, and the override means the file's channel
        # context doesn't apply.
        if [ -n "$OVERRIDE" ]; then
          echo "channel=$OVERRIDE" >> "$GITHUB_OUTPUT"
          echo "components=$INPUT_COMPONENTS" >> "$GITHUB_OUTPUT"
          echo "Using override channel: $OVERRIDE; components: $INPUT_COMPONENTS" >&2
          exit 0
        fi
        # Default path: parse the specified toolchain file.
        # The grep+sed form is more robust than TOML-strict parsing
        # for a few well-known keys: accepts any whitespace before/
        # after `=`, single OR double quotes, and ignores comments.
        # Fails loud (exit 1) if the channel can't be found.
        if [ ! -f "$TOOLCHAIN_FILE" ]; then
          echo "::error::setup-rust-toolchain: $TOOLCHAIN_FILE not found. Did checkout run? Wrong toolchain-file input?" >&2
          exit 1
        fi

        # --- channel ---
        # Match either `channel = "..."` or `channel = '...'`.
        # Double-quoted sed expression keeps the regex readable —
        # the single-quoted equivalent would need the `'\''` idiom
        # which is technically correct but gnarly. `\1` survives
        # bash double-quote expansion unchanged (it's not on the
        # short list of escape chars bash interprets inside `"`).
        # `|| true`: composite-action `shell: bash` runs with
        # `-e -o pipefail`; a no-match grep fails the pipeline and
        # kills the script with NO error output. The explicit
        # emptiness checks below are the intended failure path.
        RAW_CHAN=$(grep -E '^[[:space:]]*channel[[:space:]]*=' "$TOOLCHAIN_FILE" | head -1 || true)
        CHANNEL=$(printf '%s' "$RAW_CHAN" | sed -E "s/.*channel[[:space:]]*=[[:space:]]*[\"']([^\"']+)[\"'].*/\1/")
        if [ -z "$CHANNEL" ] || [ "$CHANNEL" = "$RAW_CHAN" ]; then
          echo "::error::setup-rust-toolchain: failed to parse channel from $TOOLCHAIN_FILE" >&2
          cat "$TOOLCHAIN_FILE" >&2
          exit 1
        fi

        # --- components (file) ---
        # `dtolnay/rust-toolchain` installs with `--profile minimal`
        # and does NOT itself read rust-toolchain.toml, so any
        # components declared in the file are silently dropped
        # unless we forward them explicitly. Parse the single-line
        # array form (`components = ["a", "b"]`) and convert to the
        # comma-separated string dtolnay's `components:` input
        # expects.
        # Missing components line → empty (the toml omits it, or
        # the file declares only the channel — fuzz's case).
        # Parse-failure detection: if the sed substitution didn't
        # match (multiline array, non-bracketed value, etc.), the
        # raw line would pass through with `=` / `[` / `]` still
        # present after tr-stripping. Fail loud with a targeted
        # message rather than passing junk to dtolnay (which would
        # fail later with a less actionable "unknown component"
        # error). Only the single-line array form is supported by
        # this composite — TOML allows multiline arrays but no
        # current toolchain file in this repo uses that shape.
        FILE_COMPONENTS=""
        # `|| true` is load-bearing here: the fuzz crate's toolchain
        # file declares ONLY a channel — under pipefail the no-match
        # grep silently exit-1'd the whole resolve step, which is
        # why every scheduled fuzz run went red from the day this
        # composite was adopted (the workspace-root file has a
        # components line, so every other job was unaffected).
        RAW_COMP=$(grep -E '^[[:space:]]*components[[:space:]]*=' "$TOOLCHAIN_FILE" | head -1 || true)
        if [ -n "$RAW_COMP" ]; then
          FILE_COMPONENTS=$(printf '%s' "$RAW_COMP" | sed -E "s/.*=[[:space:]]*\[([^]]*)\].*/\1/" | tr -d '"' | tr -d "'" | tr -d ' ')
          if [[ "$FILE_COMPONENTS" == *=* || "$FILE_COMPONENTS" == *\[* || "$FILE_COMPONENTS" == *\]* ]]; then
            echo "::error::setup-rust-toolchain: failed to parse components from $TOOLCHAIN_FILE. Only the single-line array form (components = [\"a\", \"b\"]) is supported." >&2
            cat "$TOOLCHAIN_FILE" >&2
            exit 1
          fi
        fi

        # --- merge file + input components ---
        # File's components first (the toml's declaration is the
        # baseline), then the caller's `inputs.components` appended
        # (caller adds task-specific extras like `llvm-tools-preview`
        # for coverage). Both empty → empty.
        if [ -n "$FILE_COMPONENTS" ] && [ -n "$INPUT_COMPONENTS" ]; then
          MERGED="$FILE_COMPONENTS,$INPUT_COMPONENTS"
        else
          MERGED="${FILE_COMPONENTS}${INPUT_COMPONENTS}"
        fi

        echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
        echo "components=$MERGED" >> "$GITHUB_OUTPUT"
        echo "Using pin from $TOOLCHAIN_FILE: channel=$CHANNEL; components=$MERGED (file: [$FILE_COMPONENTS], input: [$INPUT_COMPONENTS])" >&2

    - name: Install toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.resolve.outputs.channel }}
        targets: ${{ inputs.targets }}
        components: ${{ steps.resolve.outputs.components }}
