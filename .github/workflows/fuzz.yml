name: Fuzz (nightly + on-demand)

# Two trigger shapes:
#
# 1. `schedule` — runs once a day at 04:17 UTC (off-peak vs the
#    test workflow's PR traffic). Each target gets ~5 min, which
#    on a release-mode + libfuzzer-sys build is ~600k–1M execs:
#    enough to walk a non-trivial corpus, not so much that the
#    workflow charges a noticeable share of the org's CI budget.
#
# 2. `workflow_dispatch` — manual trigger with a `duration_seconds`
#    knob for when a contributor wants to soak a specific suspect
#    path. Same job, different timeouts.
#
# This workflow is deliberately NOT wired to `push` / `pull_request`
# — fuzzing is a soak workload, not a per-PR gate, and 10 min of
# nightly cargo-fuzz catches the same regressions as 30 s on every
# PR while costing ~1/10 the CI minutes.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: "Per-target soak time in seconds (default 300)"
        required: false
        default: "300"
        type: string

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [parse, eval]

    steps:
      - uses: actions/checkout@v6

      - name: Install pinned nightly toolchain
        # libfuzzer-sys needs nightly's `-Z sanitizer=address` and
        # the unstable `#[no_main]` rules cargo-fuzz wires in. The
        # parent workspace pins stable 1.95; the fuzz sub-crate
        # detaches via its own empty `[workspace]` so this nightly
        # install only affects the fuzz invocation.
        #
        # Install the *same* version `crates/rubyrs/fuzz/rust-toolchain.toml`
        # pins. Asking for plain `nightly` would silently win over
        # the file's pin because rustup honours explicit toolchain
        # selection on the command line ahead of the toolchain
        # file. To keep the pin honest, the version here MUST
        # match `crates/rubyrs/fuzz/rust-toolchain.toml`. Bump
        # them together.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-24

      - name: Install cargo-fuzz
        # Cached install — `cargo install` would otherwise rebuild
        # cargo-fuzz on every run (~90 s).
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz@0.12

      - name: Restore cargo + fuzz corpus (previous run)
        # Split restore/save so corpus growth from this run is
        # actually published for the next run to consume.
        # `actions/cache@v5` with a fixed key only saves on a
        # *cache miss* — once the entry exists, future runs
        # restore-only and discard their corpus deltas. Use the
        # run-id as the save key (always unique → always saves)
        # and a stable prefix in `restore-keys` so the previous
        # run's snapshot still loads on startup.
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/rubyrs/fuzz/target
            crates/rubyrs/fuzz/corpus
          key: ${{ runner.os }}-fuzz-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-fuzz-${{ matrix.target }}-

      - name: Seed corpus from existing test fixtures
        # First-run bootstrap: every `.rb` under `tests/diff/` and
        # `tests/fixtures/` (walked recursively — nested entries
        # like `tests/diff/require_xpkg/**` and
        # `tests/fixtures/errors/**` count) is by construction
        # valid Ruby that rubyrs handles, so they're the
        # highest-signal seeds we have. libfuzzer-sys hashes
        # inputs by content, so re-running this step is idempotent
        # (no duplicate corpus entries).
        run: |
          set -euo pipefail
          dest="crates/rubyrs/fuzz/corpus/${{ matrix.target }}"
          mkdir -p "$dest"
          # No `2>/dev/null || true` — if either fixture tree is missing or
          # a copy fails (renames, perms, FS error) we want the step to
          # fail loudly, not run with a half-populated corpus that looks
          # like a regression in the next morning's fuzz report.
          find crates/rubyrs/tests/diff     -name '*.rb' -exec cp {} "$dest/" \;
          find crates/rubyrs/tests/fixtures -name '*.rb' -exec cp {} "$dest/" \;
          count=$(find "$dest" -type f | wc -l)
          echo "seeded $count corpus entries"

      - name: Run fuzz ${{ matrix.target }}
        # `-max_total_time` is libFuzzer's wall-clock budget.
        # `-rss_limit_mb` caps memory at 2 GB so a runaway
        # `"a" * fuel` allocation times out cleanly instead of
        # OOM-killing the GitHub runner. `-timeout` per-input is at
        # 5 s so a single hung iteration surfaces as a SIGABRT and
        # fails the job — same shape as a panic crash so the artifact
        # upload path catches both.
        run: |
          cd crates/rubyrs/fuzz
          # No `+nightly` — rustup picks up the pinned channel from
          # `rust-toolchain.toml` in cwd. Forcing the channel here
          # would override the pin and reintroduce upstream-nightly
          # flakiness.
          cargo fuzz run ${{ matrix.target }} -- \
            -max_total_time=${{ github.event.inputs.duration_seconds || '300' }} \
            -rss_limit_mb=2048 \
            -timeout=5

      - name: Save fuzz corpus (publish for next run)
        # `if: always()` so even a fuzzing-discovered crash still
        # saves the grown corpus — the crashing input itself is a
        # high-value seed for next time. Matches the restore key
        # above (run-id) so save can't collide with itself; the
        # next workflow's `restore-keys` prefix picks it up.
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/rubyrs/fuzz/target
            crates/rubyrs/fuzz/corpus
          key: ${{ runner.os }}-fuzz-${{ matrix.target }}-${{ github.run_id }}

      - name: Upload crash artifacts on failure
        # `cargo fuzz` writes minimised crash repros to
        # `fuzz/artifacts/<target>/`. Surfacing these as a workflow
        # artifact means a triager can download and replay locally
        # with `cargo fuzz run <target> path/to/crash-XXXX` without
        # waiting for someone to re-run nightly.
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: fuzz-crash-${{ matrix.target }}-${{ github.run_id }}
          path: crates/rubyrs/fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 30
