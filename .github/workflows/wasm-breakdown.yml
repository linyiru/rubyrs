name: wasm-breakdown

# Cross-host cold-start measurement. NOT a gate — produces numbers
# we look at, not pass/fail. Triggered manually (workflow_dispatch)
# or on push to wasm-spike branches when the embedder / harness
# changes.
#
# Result goes to the job summary so it's visible without
# downloading artifacts, AND is uploaded as a text file so we can
# diff against later runs.
on:
  workflow_dispatch:
  push:
    branches:
      - 'spike/wasm-breakdown'
      - 'spike/wasm-**'
    paths:
      - 'perf/wasm_breakdown.sh'
      - 'perf/build_embedder.sh'
      - 'crates/rubyrs-wasm-embed/**'
      - 'crates/rubyrs-wasm-timer/**'
      - 'crates/rubyrs/src/main.rs'
      - '.github/workflows/wasm-breakdown.yml'

jobs:
  measure:
    name: Cold-start breakdown (${{ matrix.os }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      # GitHub-hosted runners. Matrix on (os, arch) so we get both
      # x86_64 (Linux baseline, contrasts cleanly with macOS arm64
      # we already have locally) and arm64 Linux (apples-to-apples
      # for Apple-Silicon dev boxes). macOS-15 row uses Apple
      # arm64 runners — same architecture as the local dev box,
      # different OS so the spawn floor can be compared
      # directly with our home measurements.
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
            host_triple: x86_64-unknown-linux-gnu
            wasi_sdk_triple: x86_64-linux
            wasmtime_triple: x86_64-linux
            wizer_triple: x86_64-linux
            wasm3_url: https://github.com/wasm3/wasm3/releases/download/v0.5.0/wasm3-linux-x64.elf
          - os: ubuntu-24.04-arm
            arch: arm64
            host_triple: aarch64-unknown-linux-gnu
            wasi_sdk_triple: arm64-linux
            wasmtime_triple: aarch64-linux
            wizer_triple: aarch64-linux
            # No prebuilt wasm3 for linux-arm64 in v0.5.0; the row
            # will be skipped automatically by perf/wasm_breakdown.sh
            # (its `command -v wasm3` guard).
            wasm3_url: ''
          - os: macos-15
            arch: arm64
            host_triple: aarch64-apple-darwin
            wasi_sdk_triple: arm64-macos
            wasmtime_triple: aarch64-macos
            wizer_triple: aarch64-macos
            # wasm3 macOS arm64 prebuilt also unavailable.
            wasm3_url: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain (wasm32-wasip1 target)
        # Same toolchain pin as the existing `wasm` job in
        # ci.yml — must match `rust-toolchain.toml` so the
        # wasm32-wasip1 std lands on the same channel cargo runs
        # under (otherwise: E0463 `can't find crate for core`).
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          targets: wasm32-wasip1

      - name: Cache cargo + wasi-sdk
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            /tmp/wasi-sdk-install
          key: ${{ matrix.os }}-${{ matrix.arch }}-wasm-bd-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-${{ matrix.arch }}-wasm-bd-

      - name: Install wasi-sdk 24
        run: |
          set -euo pipefail
          DIR="/tmp/wasi-sdk-install/wasi-sdk-24.0-${{ matrix.wasi_sdk_triple }}"
          if [ ! -d "$DIR" ]; then
            mkdir -p /tmp/wasi-sdk-install
            curl -L https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-24/wasi-sdk-24.0-${{ matrix.wasi_sdk_triple }}.tar.gz \
              | tar -xz -C /tmp/wasi-sdk-install
          fi
          echo "WASI_SDK_PATH=$DIR" >> "$GITHUB_ENV"

      - name: Install binaryen (wasm-opt)
        # Linux: apt has binaryen. macOS: brew.
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y binaryen
          else
            brew install binaryen
          fi

      - name: Install wizer
        # Matches the version + sha pinned in ci.yml. The version
        # pin is also load-bearing here because the breakdown
        # ratio depends on wizer's exact snapshot shape.
        run: |
          set -euo pipefail
          WIZER_VERSION=v11.0.3
          TARBALL="wizer-${WIZER_VERSION}-${{ matrix.wizer_triple }}.tar.xz"
          URL="https://github.com/bytecodealliance/wizer/releases/download/${WIZER_VERSION}/${TARBALL}"
          curl -sSLo "$TARBALL" "$URL"
          tar xf "$TARBALL"
          mkdir -p "$HOME/.local/bin"
          install -m 755 "wizer-${WIZER_VERSION}-${{ matrix.wizer_triple }}/wizer" "$HOME/.local/bin/wizer"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install wasmtime
        run: |
          set -euo pipefail
          WASMTIME_VERSION=v45.0.0
          TARBALL="wasmtime-${WASMTIME_VERSION}-${{ matrix.wasmtime_triple }}.tar.xz"
          URL="https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/${TARBALL}"
          curl -sSLo "$TARBALL" "$URL"
          tar xf "$TARBALL"
          mkdir -p "$HOME/.local/bin"
          install -m 755 "wasmtime-${WASMTIME_VERSION}-${{ matrix.wasmtime_triple }}/wasmtime" "$HOME/.local/bin/wasmtime"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install wasmer (Linux only, prebuilt)
        # wasmer's official install script writes to ~/.wasmer.
        # macOS skip: brew install wasmer also works but the test
        # already has macOS local numbers and we'd rather keep the
        # Linux runner clean.
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          curl -sSfL https://get.wasmer.io | sh
          echo "$HOME/.wasmer/bin" >> "$GITHUB_PATH"

      - name: Install wasm3 (when prebuilt exists)
        # v0.5.0 only ships linux-x64.elf as a prebuilt. arm64 and
        # macOS rows skip the wasm3 install; perf/wasm_breakdown.sh
        # `command -v wasm3` check then leaves the row out.
        if: matrix.wasm3_url != ''
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -L "${{ matrix.wasm3_url }}" -o "$HOME/.local/bin/wasm3"
          chmod +x "$HOME/.local/bin/wasm3"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Diagnose — does the raw wasm export wizer.initialize?
        # Triage step. Previous CI runs failed with `the Wasm module
        # does not have a wizer-initialize export` despite the
        # source clearly declaring `#[unsafe(export_name =
        # "wizer.initialize")]`. Build the .wasm and grep its
        # export section before doing anything else, so we can
        # tell whether the issue is (a) Rust not emitting the
        # export on this host, vs (b) a downstream tool stripping
        # it. Failure here STOPS the workflow with the diagnostic
        # in the log; the message includes which file we looked
        # at so it's reproducible by hand.
        run: |
          set -euo pipefail
          cargo build --release --target wasm32-wasip1 --no-default-features -p rubyrs
          WASM=target/wasm32-wasip1/release/rubyrs.wasm
          ls -la "$WASM"
          echo "--- wizer-related strings in $WASM ---"
          strings "$WASM" | grep -E "wizer\." | head -5 || echo "  (no wizer.* strings found)"
          # Quick export grep without wasm-tools. Wasm export
          # entries are stored as length-prefixed UTF-8 strings —
          # rough `strings` is enough for the "is it there"
          # question.
          if ! strings "$WASM" | grep -qF "wizer.initialize"; then
            echo "rubyrs.wasm does NOT contain the literal 'wizer.initialize' string." >&2
            echo "Rust's #[unsafe(export_name = ...)] was either not honored or the export was DCE'd." >&2
            exit 1
          fi

      - name: Pre-build the embedder (bakes cwasm via build_embedder.sh)
        # The breakdown harness benchmarks the EMBEDDER on top of
        # everything else, so we want it built before the timed
        # rows. Doing it here also keeps the breakdown step's wall
        # time small enough to read at a glance.
        run: |
          set -euo pipefail
          ./perf/build_embedder.sh

      - name: Tool versions (for the record)
        # Pin numbers in the job summary so a year from now we can
        # tell which wasmtime / wasmer / wasm3 produced this row.
        # Each tool gets one short line — anything more goes to
        # the artifact.
        run: |
          set -euo pipefail
          echo "## Tool versions" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          { uname -a; rustc --version; wasmtime --version; wizer --version; wasm-opt --version | head -1; } >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          { wasmer --version 2>/dev/null || echo "wasmer not installed"; } >> "$GITHUB_STEP_SUMMARY"
          { wasm3 --help 2>&1 | head -1 || echo "wasm3 not installed"; } >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Run wasm_breakdown.sh
        # RUNS=25 is the same default the local PoC settled on —
        # enough samples to push MIN under jitter floor without
        # making the workflow take more than a minute or two.
        env:
          RUNS: "25"
        run: |
          set -o pipefail
          ./perf/wasm_breakdown.sh 2>&1 | tee breakdown.log

      - name: Append breakdown to job summary
        run: |
          set -euo pipefail
          echo "## Cold-start breakdown (${{ matrix.os }} ${{ matrix.arch }})" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat breakdown.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload breakdown log
        uses: actions/upload-artifact@v4
        with:
          name: breakdown-${{ matrix.os }}-${{ matrix.arch }}
          path: breakdown.log
          retention-days: 30
