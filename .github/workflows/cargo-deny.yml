# Workflow `name:` is deliberately `CI` (same as the main `ci.yml`
# workflow). GitHub Actions composes required-status-check labels
# from `<workflow name> / <job name>` — sharing `name: CI` keeps
# this gate's check label `CI / Supply-chain (cargo-deny)`,
# byte-identical to its pre-extract form, so existing branch-
# protection rules continue to match without a manual cutover.
# GHA permits duplicate workflow `name:` fields; the unique
# identifier is the workflow filename.
name: CI

# Supply-chain gate — sister to panic-budget / perf-budget /
# coverage ratchets in ci.yml: catches a dep introducing a CVE,
# license-policy violation, or banned-crate at PR time rather
# than at audit time. Config lives at the workspace-root
# `deny.toml`; see that file's header for the bump-a-rule
# etiquette.
#
# Standalone workflow file (split out from `ci.yml` so a
# `paths:` filter can scope it to dep-tree changes only).
# Reasons:
#   1. paths: filter. cargo-deny only needs to run when the dep
#      tree, the policy file, or this workflow itself changes.
#      Docs-only and Ruby-source-only PRs skip the ~1-2 min
#      advisory-DB fetch + check pass. Mirrors the convention
#      established by gapscan-pr.yml.
#   2. Isolation. A transient RustSec advisory-DB flake or an
#      upstream-license clarification shouldn't block core
#      regressions — keeping cargo-deny in its own workflow file
#      makes that boundary explicit (matches framework-parity's
#      standalone-job precedent already in ci.yml).
#
# Weekly cron catches advisory-DB updates that land against a
# frozen Cargo.lock — without it, a CVE published today against
# a dep we already ship would only surface on the NEXT PR that
# happens to bump deps. Sunday 12:00 UTC matches the
# wasm-breakdown.yml convention (off Monday-morning CI peak).

on:
  # IMPORTANT: keep the `push:` and `pull_request:` paths lists in
  # sync. GitHub Actions doesn't share filters across event types,
  # so drift would silently gate master pushes on a different set
  # of files than PRs — a CVE-introducing PR could merge without
  # cargo-deny firing if the two lists diverge.
  #
  # `rust-toolchain.toml` is included because toolchain bumps shift
  # how cargo resolves transitive-dep versions and recompile
  # cargo-deny from source on cache-miss installs.
  #
  # `!crates/rubyrs/fuzz/Cargo.toml` excludes the fuzz crate's
  # manifest — `**/Cargo.toml` would match it, but fuzz is an
  # intentionally-detached sub-workspace (empty `[workspace]` block
  # so it can use nightly while the root pins stable). `cargo deny
  # check` from the workspace root does NOT traverse into it, so
  # firing the gate on fuzz-only manifest edits is pure waste with
  # no coverage gain. The flip side — that the gate also doesn't
  # catch a CVE landing inside libfuzzer-sys's tree — is an
  # accepted gap; a dedicated fuzz-scoped `cargo deny check` is a
  # separate scope (would need its own deny.toml since the fuzz
  # workspace resolves differently under nightly).
  push:
    branches: [master]
    paths:
      - 'Cargo.lock'
      - '**/Cargo.toml'
      - '!crates/rubyrs/fuzz/Cargo.toml'
      - 'deny.toml'
      - 'rust-toolchain.toml'
      - '.github/workflows/cargo-deny.yml'
  pull_request:
    branches: [master]
    paths:
      - 'Cargo.lock'
      - '**/Cargo.toml'
      - '!crates/rubyrs/fuzz/Cargo.toml'
      - 'deny.toml'
      - 'rust-toolchain.toml'
      - '.github/workflows/cargo-deny.yml'
  schedule:
    - cron: '0 12 * * 0'
  workflow_dispatch:

# Cancel in-flight PR runs when a force-push lands new commits —
# the old run's result would be discarded anyway, and cargo-deny
# can spend ~3-5 min on a cache-miss compile-from-source path.
# Master pushes / scheduled / manual runs are NOT cancelled
# (group keys by ref, and master pushes use ref=refs/heads/master
# which differs from PR refs). Mirrors gapscan-pr.yml's
# `cancel-in-progress: true` pattern.
concurrency:
  group: cargo-deny-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-deny:
    name: Supply-chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny (pinned)
        # Composite action: cache + version-pin-equality check +
        # install-with-force-on-mismatch. The `version:` input below
        # is the single source of truth for the cargo-deny pin —
        # bumping it bust-invalidates the cache and triggers a fresh
        # install. See the action's own README/header for the
        # cache-shape and version-check rationale (consolidated from
        # PR #334 / #339 reviews).
        #
        # `deny.toml` header and `docs/DEVELOPMENT.md` still need a
        # manual sync when bumping (those are docs, not CI logic).
        uses: ./.github/actions/install-pinned-cargo-tool
        with:
          tool: cargo-deny
          version: 0.19.8

      - name: Run cargo-deny checks
        # `cargo deny check` runs all four categories
        # (advisories, licenses, bans, sources) per the
        # workspace-root deny.toml. Exits non-zero on any rule
        # violation; the message names the offending crate +
        # version + which rule fired.
        run: cargo deny check
