name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust-toolchain

      - name: Install Ruby (oracle for diff tests)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Cache cargo registry + build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: "GC rooting lint (issue #90)"
        # Structural grep gate for the recurring "unrooted Value
        # held across `self.maybe_gc` + `self.heap.alloc`" hazard
        # — see issue #90 for the seven prior incidents this is
        # meant to prevent recurrence of. Heuristic but cheap;
        # every false-positive can be silenced with an inline
        # `// allow: gc-rooting — <reason>` annotation.
        run: bash scripts/lint-gc-rooting.sh

      - name: Rustdoc orientation lint
        # Catches the "docblock orphaned by inserted helper"
        # regression that bit PR #338 cycle 1 and PR #349
        # post-cycle review. When a new `pub fn Y` is added
        # between an existing `///` doc and its `pub fn X`,
        # rustdoc silently re-attaches the doc to Y, leaving
        # X undocumented. Heuristic: if `pub fn Y`'s doc
        # mentions `self.X(...)` where X is a different fn
        # in the same file, flag it. Annotate with
        # `// allow: doc-orientation` to suppress.
        run: bash scripts/lint-doc-orientation.sh

      - name: scripts/check.sh resolves its CI steps
        # check.sh runs this workflow's steps by name (scripts/ci-step.rb).
        # A dry run resolves every name, so renaming or dropping a step it
        # uses fails here instead of breaking the local check later.
        run: bash scripts/check.sh full --dry-run

      - name: Clippy (standard measurement set, -D warnings)
        # S6 (2026-07-06) cleared the feature-gated debt (95 errors) —
        # this leg keeps it cleared; deps are shared with the workspace
        # leg so the incremental cost is seconds.
        run: cargo clippy --release --all-targets -p rubyrs --locked --features stdlib,jit-native,_fiber,_json_native,mimalloc -- -D warnings

      - name: Clippy (everything combo, -D warnings)
        # The only leg that lints battery files (36 errors cleared in S6).
        run: cargo clippy --release --all-targets -p rubyrs --locked --features everything,jit-native -- -D warnings

      - name: Clippy (workspace, -D warnings)
        # Catches the style / pedantic lints that `cargo build`
        # won't notice. The workspace is at zero warnings as of
        # the May 2026 cleanup pass; this step is the wall that
        # keeps it there. Build / test already enforce -D warnings
        # at compile time via RUSTFLAGS, but neither runs clippy
        # itself, so the lints would silently regress without this.
        run: cargo clippy --release --all-targets --workspace --locked -- -D warnings

      - name: Build
        run: cargo build --release --locked --verbose

      - name: Run tests
        # Includes integration tests cext_hello + cext_bcrypt, which
        # build native C extensions through `bash build.sh`. Those
        # invocations need the host's C toolchain (gcc on ubuntu,
        # apple clang on macos) — both preinstalled on the runner —
        # plus the vendored crypt_blowfish source (tracked in
        # examples/bcrypt-cext/vendor/). The bcrypt test then runs
        # three Openwall-published bcrypt reference vectors end to
        # end through rubyrs and asserts byte-identical output.
        # Failure here means a regression in the cext FFI, not just
        # the language.
        run: cargo test --release --locked --verbose

      - name: Run tests (STRESS_GC=1)
        run: cargo test --release --locked --verbose
        env:
          STRESS_GC: "1"

      - name: Diff parity under native JIT (interpreter == JIT == CRuby)
        # The default `Run tests` step builds WITHOUT `jit-native`, so the
        # `tests/diff/*.rb` parity suite only ever exercised the interpreter —
        # a JIT that computes a WRONG value (not a crash) sailed through CI.
        # That is exactly how the value-JIT `@h[k]` bug shipped: `jit_hash_get_value`
        # ignored a Hash's default_proc on a miss, so RuboCop's `Config#for_cop`
        # returned nil and the run aborted (fixed in 8e41a045). This step re-runs
        # the SAME diff suite with the native JIT on, so any JIT/interpreter/CRuby
        # divergence fails the build. Runs on both ubuntu (x86_64) and macos
        # (arm64) via the matrix — Cranelift codegen is arch-specific.
        run: cargo test --release --locked --features jit-native --test diff_cruby
        env:
          RUBYRS_JIT_NATIVE: "1"
          # 2026-07-05: this job now inherits the workflow's
          # `-D warnings` like every other Linux/macOS job. The old
          # `RUSTFLAGS: ""` escape hatch existed for a handful of
          # jit-native warnings; they were cleaned in 6e5f4df4 (the
          # shadowed `hgid` among them turned out to be a REAL bug —
          # a silently deopted @h[k] fusion). Pre-checked clean on
          # Linux x86_64 and macOS arm64 before removing the hatch.

      - name: Diff parity under tier-2 JIT (interpreter == tier-2 == CRuby)
        # 2026-07-09: CI ran diff_cruby only in interpreter + native-JIT
        # modes; NEITHER enables the tier-2 baseline JIT (jit_tier2_on
        # gates solely on RUBYRS_JIT_TIER2). A tier-2-ONLY correctness
        # bug therefore shipped latently green — the zsuper-kwargs
        # forwarding bug (a0487d9c): a compiled body ran inline inside
        # do_call before the Op::Call arm reset trailing_hash_positional,
        # so a force-compiled bare `super` forwarded kwargs positionally.
        # THRESHOLD=1 compiles EVERY method (not just hot ones), so this
        # leg exercises the tier-2 serve for the whole diff suite.
        run: cargo test --release --locked --features jit-native --test diff_cruby
        env:
          RUBYRS_JIT_TIER2: "1"
          RUBYRS_JIT_TIER2_THRESHOLD: "1"

      - name: Verify cext example bundles build
        # Belt-and-suspenders: even if the integration tests changed
        # paths or were skipped, this step independently runs each
        # cext build script and asserts the .bundle/.so artifact got
        # produced. Without this a partial regression in build.sh
        # (e.g. a missing -D flag) could ship as "tests passed".
        run: |
          set -euo pipefail
          bash crates/rubyrs/examples/hello-cext/build.sh
          bash crates/rubyrs/examples/bcrypt-cext/build.sh
          bash crates/rubyrs/examples/self-cext/build.sh
          bash crates/rubyrs/examples/callback-cext/build.sh
          bash crates/rubyrs/examples/raise-cext/build.sh
          bash crates/rubyrs/examples/counter-cext/build.sh
          bash crates/rubyrs/examples/mini-json-cext/build.sh
          ext=$([ "$(uname -s)" = "Darwin" ] && echo bundle || echo so)
          test -f "crates/rubyrs/examples/hello-cext/hello.$ext"
          test -f "crates/rubyrs/examples/bcrypt-cext/bcrypt_ext.$ext"
          test -f "crates/rubyrs/examples/self-cext/self_test.$ext"
          test -f "crates/rubyrs/examples/callback-cext/callback_ext.$ext"
          test -f "crates/rubyrs/examples/raise-cext/raise_ext.$ext"
          test -f "crates/rubyrs/examples/counter-cext/counter_ext.$ext"
          test -f "crates/rubyrs/examples/mini-json-cext/mini_json.$ext"

  wasm:
    name: Build (wasm32-wasip1)
    # docs/DEVELOPMENT.md advertises wasm32-wasip1 as a supported
    # target. This job proves we don't quietly break that with cext
    # changes — particularly that the crate stays wasi-portable
    # with the `cext` feature off.
    #
    # We deliberately build with `--no-default-features` because
    # `cext` requires a dynamic loader (libloading + dlopen) that
    # wasm32-wasi does not have. PR #75 made that combination a
    # `build.rs` panic so users get a clear diagnostic instead of
    # a silently stub-only binary; this job therefore exercises the
    # `--no-default-features` path, which is the only meaningful
    # wasm32-wasi shape (see ADR 0015).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust toolchain (wasm32-wasip1 target)
        # Composite reads `rust-toolchain.toml` so the wasm32-wasip1
        # rust-std lands on the SAME channel cargo runs under.
        # Without this match (e.g., `@stable` while the workspace
        # is pinned to an older stable), the cross-channel mismatch
        # produces E0463 `can't find crate for core` because the
        # rust-std installed doesn't correspond to the rustc cargo
        # invokes.
        uses: ./.github/actions/setup-rust-toolchain
        with:
          targets: wasm32-wasip1

      - name: Cache cargo + wasi-sdk
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            /opt/wasi-sdk-24.0-x86_64-linux
          key: ${{ runner.os }}-wasm-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-wasm-

      - name: Install wasi-sdk 24
        # crates/rubyrs/build.rs compiles a tiny `__wasi_init_tp`
        # stub via the `cc` crate on the wasm32-wasi target. That
        # needs a wasi-aware C compiler. wasi-sdk 24 matches the
        # version documented in docs/DEVELOPMENT.md.
        run: |
          set -euo pipefail
          if [ ! -d /opt/wasi-sdk-24.0-x86_64-linux ]; then
            curl -L https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-24/wasi-sdk-24.0-x86_64-linux.tar.gz \
              | sudo tar -xz -C /opt
          fi
          echo "WASI_SDK_PATH=/opt/wasi-sdk-24.0-x86_64-linux" >> $GITHUB_ENV

      - name: Install binaryen (wasm-opt)
        # `perf/wasm_check.sh` runs `wasm-opt -Oz` on the built
        # rubyrs.wasm before the AOT-compile step. Without binaryen
        # the script falls back to skipping the -Oz pass (PASS still
        # works), but having it installed makes the CI cwasm match
        # the shipping shape and cuts ~13% off the cwasm size.
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y binaryen

      - name: Install wizer
        # `perf/wasm_check.sh` runs wizer between wasm-opt and
        # `wasmtime compile` to pre-initialize the Runtime
        # (classes + preamble bytecode) and snapshot linear
        # memory. Without wizer the script skips the pass and
        # still PASSes; with it, cold start drops ~0.5 ms
        # (~5% relative at sub-10 ms scale). Bump version +
        # checksum together when the toolchain pin moves.
        run: |
          set -euo pipefail
          WIZER_VERSION=v11.0.3
          WIZER_SHA256=36016e7f846f38ad09f22eb4bafb99068f038c431eb9613ddf59e31ad8a21414
          TARBALL="wizer-${WIZER_VERSION}-x86_64-linux.tar.xz"
          URL="https://github.com/bytecodealliance/wizer/releases/download/${WIZER_VERSION}/${TARBALL}"
          curl -sSLo "$TARBALL" "$URL"
          echo "${WIZER_SHA256}  ${TARBALL}" | sha256sum -c -
          tar xf "$TARBALL"
          mkdir -p "$HOME/.local/bin"
          install -m 755 "wizer-${WIZER_VERSION}-x86_64-linux/wizer" "$HOME/.local/bin/wizer"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install wasmtime
        # End-to-end smoke (next step) needs a wasi runtime. Pin a
        # specific release + verify a sha256 over the downloaded
        # tarball so the CI lane doesn't trust an arbitrary remote
        # install script. Bump version + checksum together when
        # `tests/wasm/smoke.sh` starts exercising newer wasi
        # proposals.
        run: |
          set -euo pipefail
          WASMTIME_VERSION=v45.0.3
          WASMTIME_SHA256=ca1fc22b676412ed1983fc2d2266c53285ac5c60954df0eeb1502abe718fd923
          TARBALL="wasmtime-${WASMTIME_VERSION}-x86_64-linux.tar.xz"
          URL="https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/${TARBALL}"
          curl -sSLo "$TARBALL" "$URL"
          echo "${WASMTIME_SHA256}  ${TARBALL}" | sha256sum -c -
          tar xf "$TARBALL"
          install -m 755 "wasmtime-${WASMTIME_VERSION}-x86_64-linux/wasmtime" "$HOME/.local/bin/wasmtime" 2>/dev/null \
            || (mkdir -p "$HOME/.local/bin" && install -m 755 "wasmtime-${WASMTIME_VERSION}-x86_64-linux/wasmtime" "$HOME/.local/bin/wasmtime")
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build + smoke (wasm32-wasip1)
        # Drives both:
        # 1. `cargo build --release --target wasm32-wasip1 -p rubyrs
        #    --no-default-features` (proves the non-cext core stays
        #    wasi-portable; `libloading` and `rubyrs-cext` are
        #    correctly opt-in via the `cext` feature; `Kernel#require`
        #    returns a clear non-cext trap rather than panicking).
        # 2. wasmtime-runs `tests/wasm/smoke.rb` against the built
        #    `.wasm` and diffs stdout against `smoke.expected`. This
        #    is the proof that wasm32-wasip1 isn't just compile-clean
        #    but actually executes end-to-end — covering puts /
        #    interpolation / Range / Array / Hash / rescue / while
        #    break / class def in one tight fixture.
        run: bash crates/rubyrs/tests/wasm/smoke.sh

      - name: Diff matrix (wasm32-wasip1 vs CRuby)
        # Third leg of the wasm correctness ladder (compile → smoke
        # → matrix). Runs a curated subset of
        # `crates/rubyrs/tests/diff/*.rb` fixtures under BOTH `ruby`
        # and `rubyrs.wasm`, asserts byte-identical stdout. Catches
        # native-vs-wasi behaviour drift the smoke fixture's one
        # script can't surface. Manifest at
        # `crates/rubyrs/tests/wasm/diff_manifest.txt`; ruby is
        # preinstalled on ubuntu-latest so no extra setup step here.
        # `diff_matrix.sh` invokes `cargo build` again — cargo's
        # incremental rebuild is a no-op after the previous smoke
        # step, so the duplicate invocation is cheap.
        run: bash crates/rubyrs/tests/wasm/diff_matrix.sh

      - name: Perf gate (wasm32-wasip1 wall time)
        # Fourth leg of the wasm ladder (compile → smoke → matrix →
        # perf). The script runs wasm-opt -Oz on the built .wasm
        # (size pass), wasmtime-compiles to .cwasm (AOT — no JIT
        # cost per invocation), then times each workload in
        # `perf/wasm_baselines.tsv` three times under
        # `wasmtime run --allow-precompiled`, takes min wall, and
        # fails if it exceeds the row's budget. Same absolute-
        # baseline policy as `perf/check.sh` (the native gate);
        # `perf/wasm_baselines.tsv` documents bumping etiquette
        # and the calibration sources.
        run: bash perf/wasm_check.sh

      - name: Compile-check trace-startup feature
        # `trace-startup` is opt-in (used only by the manually-
        # dispatched `.github/workflows/wasm-breakdown.yml`).
        # Without this check, a cfg-typo, a Rust edition migration
        # that misses the gated `Trace` struct, or a wasi-libc
        # bump that changes `eprintln!`'s linkage would compile
        # fine on master and only surface weeks later when
        # someone runs the breakdown harness. Cheap insurance: a
        # `cargo check` against the same wasm32-wasip1 target the
        # build above already warmed the cache for. Surfaced as a
        # check rather than a build to keep the step under a few
        # seconds — the breakdown workflow exercises the full
        # `cargo build --features trace-startup` path properly.
        run: cargo check --release --locked --target wasm32-wasip1 --no-default-features --features trace-startup -p rubyrs

  windows-stack-smoke:
    name: "Windows debug stack smoke (issue #356)"
    # Regression guard for issue #356. Constructing a Runtime in a
    # *debug* build compiles the always-on preamble through the
    # recursive `ast::tr`; unoptimised frames are large, and the
    # Windows default *main-thread* stack is only 1 MB (vs 8 MB on
    # Linux/macOS), so startup overflowed for debug library embedders
    # until `stacker::maybe_grow` was added to `ast::tr`. The
    # ubuntu/macos `test` matrix can't catch a regression here — their
    # 8 MB main thread hides it — so this job runs the reporter's exact
    # scenario on a real Windows main thread and fails if the process
    # aborts (stack overflow → non-zero exit).
    runs-on: windows-latest
    # Don't inherit the workflow's `-D warnings`: the crate has never
    # been lint-cleaned on Windows, and a stray cfg-unused warning would
    # mask what this job actually checks — that startup doesn't overflow
    # the 1 MB main-thread stack. Compile *errors* still fail the build,
    # surfacing genuine portability breaks.
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust-toolchain

      - name: Cache cargo registry + build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build + run preamble stack smoke (debug, reporter's features)
        # DEBUG on purpose — the overflow only manifests in unoptimised
        # builds (release shrinks the frames below the 1 MB limit).
        # `--no-default-features --features std-sink` mirrors the exact
        # dependency shape from the issue. A clean exit (0) means
        # Runtime::with_config + eval completed without overflowing the
        # Windows main-thread stack; a stack overflow aborts with a
        # non-zero code and fails the job.
        run: cargo run --locked -p rubyrs --example preamble_stack_smoke --no-default-features --features std-sink

  lockfile:
    name: Lockfile in sync
    runs-on: ubuntu-latest
    # Sister gate to cargo-deny: deny.toml scans Cargo.lock, but the build
    # steps must also be pinned to it or CI can go green against a dep set
    # the committed lock never described. Every cargo build/test/publish in
    # the workflows now passes `--locked`; this job is the belt-and-braces
    # check that the lock itself satisfies all 13 manifests, so a manifest
    # change that forgot to regenerate + commit Cargo.lock fails loudly here
    # instead of resolving up silently on a cache-miss runner.
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust-toolchain

      - name: Assert Cargo.lock satisfies every manifest
        # `--locked` makes cargo refuse to mutate Cargo.lock; if any
        # Cargo.toml drifted from the lock this exits non-zero.
        run: cargo metadata --locked --format-version 1 > /dev/null

  panic-budget:
    name: Panic budget (per-file ratchet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Count panics
        # Counts `panic!`, `.unwrap()`, `.expect(` in each rubyrs source
        # file against the per-file budgets in scripts/panic-budgets.tsv
        # (down-only; files without a row are held at 0). The budgets and
        # their history live there, not here; see docs/PANIC_AUDIT.md.
        run: bash scripts/panic-budget.sh

  perf-budget:
    name: Perf budget (peak-RSS ratchet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust-toolchain

      - name: Cache cargo registry + build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Build (release)
        # Release-mode is required — the baselines were measured
        # against optimised builds. Debug builds would blow every
        # RSS budget and tell us nothing useful.
        run: cargo build --release --locked -p rubyrs

      - name: Binary size (report)
        # Diagnostic, not (yet) a gate. The 2026-06-29 RSS analysis found
        # base RSS tracks the rubyrs binary's resident code: the arc's
        # base-RSS growth was rubyrs's own `.text` going 1.7 -> 2.1 MiB,
        # not deps / heap / the (cfg-absent) native JIT. Print the release
        # binary's section sizes every run so code growth is visible in the
        # log + job summary. The boot.rb row in perf/baselines.tsv already
        # GATES the symptom (base RSS) via the peak-RSS check below; promote
        # this to a hard `.text` ratchet once a Linux baseline is captured.
        run: |
          if command -v size >/dev/null 2>&1; then
            size target/release/rubyrs || true
            tsize=$(size target/release/rubyrs 2>/dev/null | awk 'NR==2{print $1}')
            echo "::notice title=rubyrs binary .text::release .text = ${tsize:-?} bytes"
            echo "rubyrs release \`.text\` = ${tsize:-?} bytes" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          else
            echo "::notice::\`size\` not available; skipping binary-size report"
          fi

      - name: Check peak-RSS budgets
        # Runs each workload in perf/baselines.tsv three times,
        # compares MIN peak-RSS to the row's budget, fails if any
        # exceed. Wall-time is collected but not gated here — see
        # perf/README.md for the rationale and ratchet etiquette.
        run: perf/check.sh

  json-perf-budget:
    name: Perf budget (JSON bench per-iter)
    runs-on: ubuntu-latest
    # Standalone from the script-level `perf-budget` job for the
    # same reason `framework-parity` is standalone from `Test`:
    # this gate has a different build (needs `_json_native` +
    # `stdlib` features, not the default Tier-1 binary the
    # peak-RSS gate measures) and a different failure mode (per-
    # iter µs budget, not whole-script wall + RSS). Folding them
    # into one job would require feature-toggling rebuilds in
    # the middle, which negates the per-job cache key.
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust-toolchain

      - name: Cache cargo registry + build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Separate cache key from `perf-budget` because the
          # feature set differs — sharing the cache would
          # invalidate one job's target/ on every push from the
          # other.
          key: ${{ runner.os }}-cargo-json-perf-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-json-perf-

      - name: Build (release, _json_native enabled)
        # Parity-job feature set + `mimalloc`: the perf gate
        # measures what `cli-defaults` (the `cargo install rubyrs`
        # bundle) ships — mimalloc is in that bundle by ADR 0019 v3
        # policy, and the JSON workload is alloc/free-bound (the
        # 2026-07 parse-side GC safe point made sweep cost an
        # honest part of parse; mimalloc keeps parse ahead of
        # CRuby with bounded RSS). Byte-level parity is still
        # gated by the framework/stdlib jobs on the allocator-
        # neutral build — the allocator cannot change bytes.
        run: |
          cargo build --release --locked -p rubyrs \
            --features default,stdlib,_http_server,_fiber,_json_native,mimalloc

      - name: Check JSON bench per-iter budgets
        # Runs bench/json_bench.rb 3× under reduced ITERS (2000
        # vs the README default 5000) for sub-3 s gate wall;
        # the min-of-runs absorbs warm-up + GC the same way the
        # peak-RSS gate does. Budgets in
        # bench/json_bench_baselines.tsv per-metric.
        run: bash bench/json_bench_check.sh

  miri:
    name: Miri smoke (Stacked + Tree Borrows)
    # ADR 0013 documents the CURRENT_VM_PTR raw-pointer escape
    # used for cext re-entrance. Runs Miri against every test
    # subset that does NOT touch Prism (vendored C — Miri can't
    # execute foreign code) or `dlopen`, under both default
    # Stacked Borrows and `-Zmiri-tree-borrows`. A regression
    # in the non-cext Vm code would land red here; the cext
    # dispatch path itself is documented as Miri-unverifiable
    # (see ADR 0013's "Miri verification record").
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust nightly + Miri
        # `channel-override: nightly` because miri requires nightly
        # (the workspace `rust-toolchain.toml` pins a stable
        # channel; miri tools aren't shipped there). Miri's nightly
        # date is unpinned by design — we want the freshest miri
        # rules to catch the most aliasing patterns; PR #248
        # documents the trade-off.
        uses: ./.github/actions/setup-rust-toolchain
        with:
          channel-override: nightly
          components: miri, rust-src

      - name: Cache cargo + miri sysroot
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-miri-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-miri-

      - name: Miri setup
        run: cargo +nightly miri setup

      - name: Miri (Stacked Borrows) — vm/* unit tests
        run: |
          cargo +nightly miri test --lib -p rubyrs vm::lookup::
          cargo +nightly miri test --lib -p rubyrs vm::gc::
          cargo +nightly miri test --lib -p rubyrs vm::raise::

      - name: Miri (Stacked Borrows) — cext reentrance + FFI tests
        # vm::cext::miri_tests covers the CURRENT_VM_PTR
        # reborrow shape that the actual cext path uses (ADR
        # 0013); rubyrs-cext::safety_negative covers per-fn
        # FFI surface. Neither hits dlopen, so both are
        # Miri-runnable.
        run: |
          cargo +nightly miri test --lib -p rubyrs vm::cext::miri_tests::
          cargo +nightly miri test -p rubyrs-cext --test safety_negative

      - name: Miri (Tree Borrows) — same subset
        env:
          MIRIFLAGS: "-Zmiri-tree-borrows"
        run: |
          cargo +nightly miri test --lib -p rubyrs vm::lookup::
          cargo +nightly miri test --lib -p rubyrs vm::gc::
          cargo +nightly miri test --lib -p rubyrs vm::raise::
          cargo +nightly miri test --lib -p rubyrs vm::cext::miri_tests::
          cargo +nightly miri test -p rubyrs-cext --test safety_negative

  coverage:
    name: Coverage (per-file ratchet)
    # Same ratchet philosophy as panic-budget / perf-budget: per-file
    # baselines stored in-tree; CI fails if any file drops below
    # `baseline - tolerance_pct`. The tolerance absorbs sub-1% noise from
    # minor refactors; intentional drops are reviewed via the baseline-
    # JSON diff. See docs/COVERAGE.md.
    runs-on: ubuntu-latest
    # Single source of truth for the cargo-llvm-cov pin INSIDE this
    # job. Referenced by both the instrumented-target/ cache key and
    # the install-pinned-cargo-tool composite invocation, so a bump
    # in one place can't drift from the other. (docs/COVERAGE.md
    # carries a literal install-command copy that still requires
    # manual sync — that's docs, not CI logic.)
    env:
      CARGO_LLVM_COV_VERSION: 0.8.7
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust toolchain + llvm-tools-preview
        # Composite reads rust-toolchain.toml so `llvm-tools-preview`
        # lands on the same channel cargo runs under. Without
        # matching channels, cargo-llvm-cov self-heals by rustup-
        # component-add on first run, but pinning explicitly is
        # the contract — avoids the implicit fallback.
        uses: ./.github/actions/setup-rust-toolchain
        with:
          components: llvm-tools-preview

      - name: Install Ruby (oracle for diff tests)
        # The same diff-vs-CRuby integration tests the `test` job uses;
        # without Ruby on PATH they're skipped, which would deflate the
        # measured coverage and force a baseline lowering on every run.
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Cache instrumented target/ for coverage build
        uses: actions/cache@v5
        with:
          path: target
          # Separate cache key from `test` job — the coverage job needs
          # an INSTRUMENTED build (rustc-LLVM-cov flags differ), so its
          # target/ artifacts shouldn't share with the release-built test
          # job's cache or each would invalidate the other's.
          #
          # Embeds the cargo-llvm-cov pin so a version bump
          # bust-invalidates the build artifacts too (instrumentation
          # may change between releases).
          key: ${{ runner.os }}-coverage-target-llvm-cov-${{ env.CARGO_LLVM_COV_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-coverage-target-llvm-cov-${{ env.CARGO_LLVM_COV_VERSION }}-

      - name: Install cargo-llvm-cov (pinned)
        # Composite action: cache (registry + binary) + version-pin
        # equality check + install-with-force-on-mismatch. Replaces
        # the prior bespoke `command -v` install which would let a
        # runner-cached different version silently take over.
        #
        # The pinned version (see CARGO_LLVM_COV_VERSION above) produced
        # the seeded crates/rubyrs/coverage_baseline.json; keep them in
        # lockstep when bumping (re-run `--update` against the new tool
        # first).
        uses: ./.github/actions/install-pinned-cargo-tool
        with:
          tool: cargo-llvm-cov
          version: ${{ env.CARGO_LLVM_COV_VERSION }}

      - name: Generate LCOV report
        # `--workspace` covers every crate in the workspace; the ratchet
        # script filters to `crates/` so registry-built deps don't pollute
        # the baseline. `--lcov` is the standard format and matches the
        # ratchet's parser. `--all-targets` covers integration tests too
        # (under tests/), which exercise embed-API surfaces the unit
        # tests miss. STRESS_GC stays OFF here — coverage doesn't care
        # about GC pressure, and the extra runtime cost is wasted.
        #
        # RUST_MIN_STACK: the debug+instrumented build's frames are
        # 2-3x release (same inflation the vm/gc.rs dispatch-cap
        # comment documents), and preamble_cache's unit tests drive
        # the full LIVE preamble compile (deep plain-Rust recursion in
        # the compiler — the debug dispatch cap can't bound it).
        # Under the default 2 MB test-thread stack that reproducibly
        # SIGABRTs (`preamble_cache::tests::stale_format_version_
        # rejected` overflows); 16 MB test threads run it clean.
        # Scoped to this step only — release test jobs don't need it.
        env:
          RUST_MIN_STACK: "16777216"
        run: cargo llvm-cov --workspace --all-targets --locked --lcov --output-path lcov.info

      - name: Ratchet per-file coverage
        # Compares parsed LCOV against crates/rubyrs/coverage_baseline.json.
        # Fails on any file below `baseline - tolerance_pct` (1.0% default).
        # New source files without a baseline also fail — the host adds
        # them via `python3 scripts/coverage_ratchet.py --update` after
        # measuring locally; the baseline diff lands in the PR.
        run: python3 scripts/coverage_ratchet.py --lcov lcov.info --baseline crates/rubyrs/coverage_baseline.json

      - name: Upload LCOV artifact
        # Available for download from the Actions UI so reviewers can
        # inspect the per-line picture when investigating a regression.
        # The actions/upload-artifact@v7 default is 90 days (or org-
        # configured), not 30 — set retention-days explicitly so the
        # contract matches docs/COVERAGE.md and this workflow comment.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lcov-${{ github.run_id }}
          path: lcov.info
          retention-days: 30

  framework-parity:
    name: Framework parity (smoke)
    # M27 D / ADR 0026 v2 §"Compatibility contract" — the
    # "same code runs on both" claim becomes a CI gate. Each menu
    # item gets a fixture under
    # `crates/rubyrs/tests/diff_framework/fixtures/`; the test
    # spawns rubyrs and CRuby side-by-side, replays a declarative
    # route matrix, and byte-diffs the response transcripts after
    # an optional normalisation pass.
    #
    # Standalone job (not folded into `Test`) per ADR 0026 v2
    # §Negative consequences "tiered parity (smoke per PR, full
    # matrix nightly)": a gem-install / upstream-version flake
    # here should NOT block core regressions, and each menu item
    # (Sinatra now, JSON / ActiveSupport-lite / Sequel-lite next)
    # adds a row to this job's matrix, not the Test job's.
    #
    # Smoke tier: ubuntu only, one Ruby version. Fixtures gated
    # here track the omakase menu (ADR 0026 v2) PLUS the M27
    # third-party-plugin claim: `hello_smoke` (stdlib-only Rack
    # shape, gates harness correctness), `sinatra_hello` (18-route
    # matrix — menu #1), `sinatra_plugin_smoke` (reopen-Base plugin
    # authoring shape — menu #1 plugin support, M27 A4),
    # `sinatra_register_smoke` (register + helpers shape — menu #1
    # plugin support, alternate authoring contract),
    # `sinatra_jsonp_smoke` (real `sinatra-jsonp-0.5.0` gem vendored
    # 1:1 — proves a published gem loads + runs unmodified on both
    # runtimes), `sinatra_cors_smoke` (real `sinatra-cors-1.2.0`
    # gem vendored 1:1 — exercises register/helpers + block-form
    # `set` + condition + after-filter + OPTIONS + `keep_headers`
    # hook; the deepest Sinatra-plugin authoring surface yet),
    # `sinatra_param_smoke` (real `sinatra-param-1.6.0` gem vendored
    # 1:1 — exercises helpers shape + param coercion across Integer/
    # Float/Boolean/Array + min/max/in/format validators + any_of),
    # `rack_cors_smoke` (real `rack-cors-3.0.0` gem vendored 1:1 —
    # first middleware-shaped vendoring; exercises sinatra_lite's
    # new `use Klass` chain + Rack::Utils / Rack::Headers shim +
    # Regexp.{compile,quote} for origin matching + safe-navigation
    # `&.` for the Vary header walk),
    # `multi_route_smoke` (real `sinatra-contrib-4.2.1`
    # `sinatra/multi_route.rb` vendored 1:1 — first sinatra-contrib
    # fixture; exercises `register Sinatra::Plugin` extend-onto-
    # singleton path, class-method `super` through extended modules,
    # and `super(*args, &block)` forwarding via Op::ApplySuperBlock),
    # `required_params_smoke` (real
    # `sinatra-contrib-4.2.1/lib/sinatra/required_params.rb`
    # vendored 1:1 — exercises the helper-mixin path
    # (`helpers Sinatra::RequiredParams`), `halt 400` from a helper
    # invoked inside a route, Hash#key? + recursion across simple/
    # Array key shapes, and `&.` safe-navigation on params),
    # `sinatra_json_smoke` (real
    # `sinatra-contrib-4.2.1/lib/sinatra/json.rb` vendored 1:1 —
    # first content-type=application/json fixture; exercises the
    # `json obj` helper across flat/nested/array/primitive shapes,
    # per-call `:content_type` override, and the
    # `Base.set :json_encoder do ::MultiJson end` arity-0
    # deferred-value path. sinatra_lite's `set` now distinguishes
    # block arity (0 → eager value-eval, ≥1 → route-option
    # handler) and settings readers walk the superclass chain so
    # plugin-installed settings on Sinatra::Base reach every
    # subclass),
    # `link_header_smoke` (real
    # `sinatra-contrib-4.2.1/lib/sinatra/link_header.rb` vendored
    # 1:1 — exercises `link` / `stylesheet` / `prefetch` /
    # `link_headers` helpers, response[]/[]= bracket surface on
    # sinatra_lite, :css mime entry, and Hash#to_hash duck-type
    # probe; keep_headers admits the Link header into the diff
    # transcript),
    # `sinatra_extension_smoke` (real
    # `sinatra-contrib-4.2.1/lib/sinatra/extension.rb` vendored
    # 1:1 — exercises the method-recorder + replay pattern via
    # method_missing on Module/Class receivers; surfaced and
    # fixed a real rubyrs gap where try_method_missing skipped
    # Class/Module receivers entirely),
    # `sinatra_flash_smoke` (real `sinatra-flash-0.3.0` vendored
    # 1:1 — exercises FlashHash's @now/@next dance and the
    # styled_flash HTML helper; required Class.new block-form,
    # `class < <expr>`, AND Hash iter pair-yield VM fixes to
    # work end-to-end. Ships a minimal `delegate.rb` shim because
    # rubyrs's primitive-class `instance_methods(false)` returns
    # empty, so CRuby DelegateClass's reflection-driven path
    # can't enumerate Hash's method list),
    # `rack_protection_smoke` (real `rack-protection-4.2.1`
    # base.rb + FrameOptions + XSSHeader + PathTraversal vendored
    # 1:1 — second middleware-shaped vendoring after
    # rack_cors_smoke. Exercises the security-header injection
    # paths AND the PathTraversal cleanup of `%2e%2e/` parent-pop
    # and `%2f` encoded-slash. Ships no-op `rack.rb` / `digest.rb`
    # / `logger.rb` / `uri.rb` stubs; required Array#any?
    # no-block predicate),
    # `json_smoke` + `json_canon` (menu #2),
    # `as_lite_canon` (menu #3), and `sqlite_smoke` (menu #4 / ADR
    # 0027 Phase 4). Each fixture is one ship gate, not a
    # regression bench — perf lives in the standalone bench jobs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust-toolchain

      - name: Install Ruby
        # 3.4 to match the `Test` job above so the parity oracle
        # tracks the same MRI version the rest of CI runs against.
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Install parity-matrix gems
        # Two CRuby fixtures need explicit gems:
        #   - `fixtures/hello_smoke/compat.rb` does `require
        #     "webrick"` directly (no Sinatra in scope) — Webrick
        #     was unbundled from Ruby's stdlib in 3.0+ so the CI
        #     image's Ruby 3.4 doesn't ship it preinstalled.
        #   - `fixtures/sinatra_hello/` needs Sinatra plus a
        #     server fallback. Sinatra 4.x's runtime deps are
        #     rack / rack-protection / tilt / mustermann /
        #     ruby2_keywords — webrick is NOT among them.
        #
        # An earlier version of this step claimed `gem install
        # sinatra` pulled in webrick transitively and ran CI red
        # against `cannot load such file -- webrick (LoadError)`
        # from hello_smoke (which has no sinatra context).
        # Install both explicitly to cover both fixtures.
        #
        # `activesupport` is the blessed-menu pin (ADR 0026 item 3)
        # for the ActiveSupport-lite parity gates: the `as_lite_canon`
        # diff_framework fixture AND the `activesupport_core_ext`
        # diff_cruby gem-oracle below both diff the vendored canon
        # against this exact gem version. Keep the pin in lock-step
        # with the version stated in active_support_lite.rb's header.
        #
        # `sqlite3` is the menu-item-4 pin (ADR 0027 Phase 4): the
        # `sqlite_smoke` diff_framework fixture diffs the rubyrs
        # `_sqlite` battery (`require "rubyrs/sqlite"`, gated behind
        # the `_sqlite` Cargo feature) against this CRuby gem's
        # `SQLite3::Database` / `Statement` / `ConstraintException`
        # surface. No explicit version pin — both runtimes link a
        # bundled libsqlite3 (3.47.x family) so the SQL semantics are
        # identical; only the Ruby-side gem façade matters here.
        #
        # `multi_json` is the `sinatra_jsonp_smoke` fixture's
        # parity oracle. The vendored `sinatra-jsonp-0.5.0`
        # source loads via `require 'multi_json'`; rubyrs
        # resolves it to a tiny shim (vendor/multi_json.rb)
        # that wraps JSON.generate, CRuby resolves it to
        # this gem. Both produce byte-identical output for
        # the deterministic subset (flat Hash with primitives)
        # the fixture exercises.
        run: |
          # `puma` + `rackup` are required by Sinatra 4.2.x's
          # default server stack ("Sinatra could not start, the
          # required gems weren't found! Add them to your bundle
          # with: bundle add rackup puma"). Earlier Sinatra
          # versions defaulted to WEBrick alone; 4.2 made the
          # rackup + puma pair the default server. Without these
          # the four Sinatra-shape fixtures (sinatra_hello /
          # sinatra_plugin_smoke / sinatra_register_smoke /
          # sinatra_jsonp_smoke) all fail their boot probe with
          # the gems-missing error before serving any request.
          gem install webrick sinatra puma rackup
          gem install activesupport -v 8.0.1
          gem install sqlite3
          gem install multi_json
          # `json` 2.x (>= 2.10): oracle for `json_parity_battery`.
          # The default gem bundled with ruby is the older 2.9 line
          # (Float#to_s float emission); the battery pins the
          # maintained fpconv format — the fixture runner probes the
          # activatable version and skips if only 2.9 is present, so
          # this install is what makes the battery bite in CI.
          gem install json -v 2.20.0
          # `sinatra-cors` is the parity oracle for the
          # `sinatra_cors_smoke` fixture — real gem source vendored
          # 1:1 under `vendor/sinatra/cors.rb`. Both runtimes load
          # the SAME file via $LOAD_PATH.unshift, so on CRuby the
          # vendored copy resolves before the installed gem. The
          # gem install IS still required because the
          # gem-availability probe (`ruby -e "require 'sinatra/cors'"`)
          # runs without the vendored shim's $LOAD_PATH munge.
          gem install sinatra-cors
          # `sinatra-param` is the parity oracle for the
          # `sinatra_param_smoke` fixture — real `sinatra-param-1.6.0`
          # gem source vendored 1:1 under `vendor/sinatra/param.rb`.
          # Same pattern as sinatra-cors: both runtimes resolve the
          # vendored copy first; gem install is needed so the
          # availability probe (`require 'sinatra/param'`) passes.
          gem install sinatra-param
          # `rack-cors` is the parity oracle for `rack_cors_smoke`
          # — real `rack-cors-3.0.0` gem source vendored 1:1 under
          # `vendor/rack/cors.rb`. Exercises sinatra_lite's new
          # `use Klass` middleware chain end-to-end (the first
          # vendored gem that's middleware-shaped rather than a
          # Sinatra plugin).
          gem install rack-cors
          # `sinatra-contrib` is the parity oracle for the
          # `multi_route_smoke` fixture — only `sinatra/multi_route`
          # is exercised today, but the whole gem is one install.
          # The vendored copy under
          # `multi_route_smoke/vendor/sinatra/multi_route.rb`
          # resolves first on both runtimes; gem install satisfies
          # the availability probe (`require 'sinatra/multi_route'`).
          gem install sinatra-contrib
          # `sinatra-flash` (standalone gem, not part of
          # sinatra-contrib) — parity oracle for the
          # `sinatra_flash_smoke` fixture. Vendored 1:1 under
          # `vendor/sinatra/flash.rb` + three companion files; gem
          # install satisfies the `require 'sinatra/flash'`
          # availability probe.
          gem install sinatra-flash
          # `rack-protection` is the parity oracle for the
          # `rack_protection_smoke` fixture — base.rb + 3
          # security-header middlewares vendored 1:1. Gem install
          # makes the `require 'rack/protection/frame_options'`
          # availability probe succeed.
          gem install rack-protection

      - name: Cache cargo registry + build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-parity-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build flori-json-cext bundles (json_smoke fixture)
        # `fixtures/json_smoke/` requires the flori-json-cext
        # parser bundle on the rubyrs side; without it the harness
        # skip-not-fails the fixture. build.sh recompiles rubyrs
        # first (cheap — the test job below also builds release),
        # then compiles the vendored flori/json sources with the
        # rubyrs cext header shims. PROFILE=release matches the
        # binary the framework-parity tests will dlopen against.
        run: PROFILE=release bash crates/rubyrs/examples/flori-json-cext/build.sh

      - name: Run framework-parity tests
        # The diff_framework binary is `#[cfg(feature =
        # "_http_server")]` so the harness only compiles with the
        # battery enabled — feature gate matches the menu's actual
        # Tier-3 dependency. `_fiber` is bundled so streaming-
        # capable fixtures work end-to-end. `stdlib` activates the
        # embedded pure-Ruby canon (src/stdlib_vendor/*.rb) so
        # fixtures like `json_canon` resolve `require "json"` to
        # the in-tree JSON impl rather than the lenient stub.
        # `_json_native` registers the serde_json accelerator —
        # `json_canon` then exercises the native parse/generate
        # path (the same one users get with `--features
        # _json_native` in production), so any byte-diff drift
        # between the canon and the accelerator surfaces on
        # every PR rather than only in nightly bench. Other
        # features (cext, regex, bignum) come from
        # `--features default`.
        run: |
          cargo test --release --locked \
            --features default,stdlib,_http_server,_fiber,_json_native,_sqlite \
            --test diff_framework \
            -- --nocapture

      - name: Run stdlib-canon parity tests (diff_cruby, gem-oracle)
        # The `stdlib`-gated `diff_cruby` fixtures (json_roundtrip,
        # activesupport_core_ext) are compiled out of the default
        # Test job (which builds without `--features stdlib`), so run
        # them here where the canon AND the blessed gems are both
        # present. `activesupport_core_ext` uses the gem-oracle
        # `run_diff_gem` and diffs the vendored ActiveSupport-lite
        # canon against the pinned `activesupport` installed above;
        # `json_roundtrip` diffs the JSON canon against CRuby's stdlib.
        run: |
          cargo test --release --locked \
            --features default,stdlib,_http_server,_fiber,_json_native,_sqlite \
            --test diff_cruby \
            -- --nocapture

      - name: Run diff_cruby under STRESS_GC=1
        # GC-rooting safety net. The `test` job's STRESS_GC step
        # only runs the default-feature test set (no stdlib gates,
        # no `_http_server`, no `_sqlite`), so the broad parity
        # subset that's compiled here under the full feature flags
        # never exercised STRESS_GC pre-this-step. Catches PinGuard
        # gaps in dispatch paths that only land under the full
        # feature combination — surfaced PR by PR as the
        # parity matrix expands (commit b8e326f6 fixed one such
        # gap in Klass.new block-form initialize; the gap had
        # silently shipped for ~15 commits before reproducing here
        # would have caught it on PR).
        #
        # diff_framework is intentionally NOT in this STRESS_GC
        # run — its HTTP-server harness is throughput-bound and
        # STRESS_GC turns it into a multi-hour wait. The dispatch-
        # path coverage diff_cruby gives is the high-value part;
        # framework fixtures rely on the same dispatch routines
        # so any STRESS_GC bug surfaces here first anyway.
        run: |
          cargo test --release --locked \
            --features default,stdlib,_http_server,_fiber,_json_native,_sqlite \
            --test diff_cruby \
            -- --nocapture
        env:
          STRESS_GC: "1"
