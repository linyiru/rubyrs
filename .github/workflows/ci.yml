name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Ruby (oracle for diff tests)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Cache cargo registry + build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: GC rooting lint (issue #90)
        # Structural grep gate for the recurring "unrooted Value
        # held across `self.maybe_gc` + `self.heap.alloc`" hazard
        # — see issue #90 for the seven prior incidents this is
        # meant to prevent recurrence of. Heuristic but cheap;
        # every false-positive can be silenced with an inline
        # `// allow: gc-rooting — <reason>` annotation.
        run: bash scripts/lint-gc-rooting.sh

      - name: Clippy (workspace, -D warnings)
        # Catches the style / pedantic lints that `cargo build`
        # won't notice. The workspace is at zero warnings as of
        # the May 2026 cleanup pass; this step is the wall that
        # keeps it there. Build / test already enforce -D warnings
        # at compile time via RUSTFLAGS, but neither runs clippy
        # itself, so the lints would silently regress without this.
        run: cargo clippy --release --all-targets --workspace -- -D warnings

      - name: Build
        run: cargo build --release --verbose

      - name: Run tests
        # Includes integration tests cext_hello + cext_bcrypt, which
        # build native C extensions through `bash build.sh`. Those
        # invocations need the host's C toolchain (gcc on ubuntu,
        # apple clang on macos) — both preinstalled on the runner —
        # plus the vendored crypt_blowfish source (tracked in
        # examples/bcrypt-cext/vendor/). The bcrypt test then runs
        # three Openwall-published bcrypt reference vectors end to
        # end through rubyrs and asserts byte-identical output.
        # Failure here means a regression in the cext FFI, not just
        # the language.
        run: cargo test --release --verbose

      - name: Run tests (STRESS_GC=1)
        run: cargo test --release --verbose
        env:
          STRESS_GC: "1"

      - name: Verify cext example bundles build
        # Belt-and-suspenders: even if the integration tests changed
        # paths or were skipped, this step independently runs each
        # cext build script and asserts the .bundle/.so artifact got
        # produced. Without this a partial regression in build.sh
        # (e.g. a missing -D flag) could ship as "tests passed".
        run: |
          set -euo pipefail
          bash crates/rubyrs/examples/hello-cext/build.sh
          bash crates/rubyrs/examples/bcrypt-cext/build.sh
          bash crates/rubyrs/examples/self-cext/build.sh
          bash crates/rubyrs/examples/callback-cext/build.sh
          bash crates/rubyrs/examples/raise-cext/build.sh
          bash crates/rubyrs/examples/counter-cext/build.sh
          bash crates/rubyrs/examples/mini-json-cext/build.sh
          ext=$([ "$(uname -s)" = "Darwin" ] && echo bundle || echo so)
          test -f "crates/rubyrs/examples/hello-cext/hello.$ext"
          test -f "crates/rubyrs/examples/bcrypt-cext/bcrypt_ext.$ext"
          test -f "crates/rubyrs/examples/self-cext/self_test.$ext"
          test -f "crates/rubyrs/examples/callback-cext/callback_ext.$ext"
          test -f "crates/rubyrs/examples/raise-cext/raise_ext.$ext"
          test -f "crates/rubyrs/examples/counter-cext/counter_ext.$ext"
          test -f "crates/rubyrs/examples/mini-json-cext/mini_json.$ext"

  wasm:
    name: Build (wasm32-wasip1)
    # docs/DEVELOPMENT.md advertises wasm32-wasip1 as a supported
    # target. This job proves we don't quietly break that with cext
    # changes — particularly that the crate stays wasi-portable
    # with the `cext` feature off.
    #
    # We deliberately build with `--no-default-features` because
    # `cext` requires a dynamic loader (libloading + dlopen) that
    # wasm32-wasi does not have. PR #75 made that combination a
    # `build.rs` panic so users get a clear diagnostic instead of
    # a silently stub-only binary; this job therefore exercises the
    # `--no-default-features` path, which is the only meaningful
    # wasm32-wasi shape (see ADR 0015).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain (wasm32-wasip1 target)
        # `dtolnay/rust-toolchain@stable` would install rust-std for
        # the *stable* channel — but `rust-toolchain.toml` in this
        # repo pins the build to 1.95, so cargo would run under 1.95
        # while the wasm32-wasip1 std lived on stable, producing
        # "can't find crate for `core`" (E0463). Pin to 1.95
        # explicitly here so the target install lands on the same
        # channel cargo will actually run under.
        #
        # The duplication with `rust-toolchain.toml` is unavoidable:
        # `dtolnay/rust-toolchain@master` treats `toolchain` as a
        # required input (the action errors with "toolchain is a
        # required input" if omitted). If/when rust-toolchain.toml
        # bumps, both places need updating in lockstep.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          targets: wasm32-wasip1

      - name: Cache cargo + wasi-sdk
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            /opt/wasi-sdk-24.0-x86_64-linux
          key: ${{ runner.os }}-wasm-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-wasm-

      - name: Install wasi-sdk 24
        # crates/rubyrs/build.rs compiles a tiny `__wasi_init_tp`
        # stub via the `cc` crate on the wasm32-wasi target. That
        # needs a wasi-aware C compiler. wasi-sdk 24 matches the
        # version documented in docs/DEVELOPMENT.md.
        run: |
          set -euo pipefail
          if [ ! -d /opt/wasi-sdk-24.0-x86_64-linux ]; then
            curl -L https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-24/wasi-sdk-24.0-x86_64-linux.tar.gz \
              | sudo tar -xz -C /opt
          fi
          echo "WASI_SDK_PATH=/opt/wasi-sdk-24.0-x86_64-linux" >> $GITHUB_ENV

      - name: Install binaryen (wasm-opt)
        # `perf/wasm_check.sh` runs `wasm-opt -Oz` on the built
        # rubyrs.wasm before the AOT-compile step. Without binaryen
        # the script falls back to skipping the -Oz pass (PASS still
        # works), but having it installed makes the CI cwasm match
        # the shipping shape and cuts ~13% off the cwasm size.
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y binaryen

      - name: Install wizer
        # `perf/wasm_check.sh` runs wizer between wasm-opt and
        # `wasmtime compile` to pre-initialize the Runtime
        # (classes + preamble bytecode) and snapshot linear
        # memory. Without wizer the script skips the pass and
        # still PASSes; with it, cold start drops ~0.5 ms
        # (~5% relative at sub-10 ms scale). Bump version +
        # checksum together when the toolchain pin moves.
        run: |
          set -euo pipefail
          WIZER_VERSION=v11.0.3
          WIZER_SHA256=36016e7f846f38ad09f22eb4bafb99068f038c431eb9613ddf59e31ad8a21414
          TARBALL="wizer-${WIZER_VERSION}-x86_64-linux.tar.xz"
          URL="https://github.com/bytecodealliance/wizer/releases/download/${WIZER_VERSION}/${TARBALL}"
          curl -sSLo "$TARBALL" "$URL"
          echo "${WIZER_SHA256}  ${TARBALL}" | sha256sum -c -
          tar xf "$TARBALL"
          mkdir -p "$HOME/.local/bin"
          install -m 755 "wizer-${WIZER_VERSION}-x86_64-linux/wizer" "$HOME/.local/bin/wizer"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install wasmtime
        # End-to-end smoke (next step) needs a wasi runtime. Pin a
        # specific release + verify a sha256 over the downloaded
        # tarball so the CI lane doesn't trust an arbitrary remote
        # install script. Bump version + checksum together when
        # `tests/wasm/smoke.sh` starts exercising newer wasi
        # proposals.
        run: |
          set -euo pipefail
          WASMTIME_VERSION=v45.0.0
          WASMTIME_SHA256=9d92e6dc04630f617e0e5d532327a5a917ac4898587e07f4fb7a5fc7fffef760
          TARBALL="wasmtime-${WASMTIME_VERSION}-x86_64-linux.tar.xz"
          URL="https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/${TARBALL}"
          curl -sSLo "$TARBALL" "$URL"
          echo "${WASMTIME_SHA256}  ${TARBALL}" | sha256sum -c -
          tar xf "$TARBALL"
          install -m 755 "wasmtime-${WASMTIME_VERSION}-x86_64-linux/wasmtime" "$HOME/.local/bin/wasmtime" 2>/dev/null \
            || (mkdir -p "$HOME/.local/bin" && install -m 755 "wasmtime-${WASMTIME_VERSION}-x86_64-linux/wasmtime" "$HOME/.local/bin/wasmtime")
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build + smoke (wasm32-wasip1)
        # Drives both:
        # 1. `cargo build --release --target wasm32-wasip1 -p rubyrs
        #    --no-default-features` (proves the non-cext core stays
        #    wasi-portable; `libloading` and `rubyrs-cext` are
        #    correctly opt-in via the `cext` feature; `Kernel#require`
        #    returns a clear non-cext trap rather than panicking).
        # 2. wasmtime-runs `tests/wasm/smoke.rb` against the built
        #    `.wasm` and diffs stdout against `smoke.expected`. This
        #    is the proof that wasm32-wasip1 isn't just compile-clean
        #    but actually executes end-to-end — covering puts /
        #    interpolation / Range / Array / Hash / rescue / while
        #    break / class def in one tight fixture.
        run: bash crates/rubyrs/tests/wasm/smoke.sh

      - name: Diff matrix (wasm32-wasip1 vs CRuby)
        # Third leg of the wasm correctness ladder (compile → smoke
        # → matrix). Runs a curated subset of
        # `crates/rubyrs/tests/diff/*.rb` fixtures under BOTH `ruby`
        # and `rubyrs.wasm`, asserts byte-identical stdout. Catches
        # native-vs-wasi behaviour drift the smoke fixture's one
        # script can't surface. Manifest at
        # `crates/rubyrs/tests/wasm/diff_manifest.txt`; ruby is
        # preinstalled on ubuntu-latest so no extra setup step here.
        # `diff_matrix.sh` invokes `cargo build` again — cargo's
        # incremental rebuild is a no-op after the previous smoke
        # step, so the duplicate invocation is cheap.
        run: bash crates/rubyrs/tests/wasm/diff_matrix.sh

      - name: Perf gate (wasm32-wasip1 wall time)
        # Fourth leg of the wasm ladder (compile → smoke → matrix →
        # perf). The script runs wasm-opt -Oz on the built .wasm
        # (size pass), wasmtime-compiles to .cwasm (AOT — no JIT
        # cost per invocation), then times each workload in
        # `perf/wasm_baselines.tsv` three times under
        # `wasmtime run --allow-precompiled`, takes min wall, and
        # fails if it exceeds the row's budget. Same absolute-
        # baseline policy as `perf/check.sh` (the native gate);
        # `perf/wasm_baselines.tsv` documents bumping etiquette
        # and the calibration sources.
        run: bash perf/wasm_check.sh

      - name: Compile-check trace-startup feature
        # `trace-startup` is opt-in (used only by the manually-
        # dispatched `.github/workflows/wasm-breakdown.yml`).
        # Without this check, a cfg-typo, a Rust edition migration
        # that misses the gated `Trace` struct, or a wasi-libc
        # bump that changes `eprintln!`'s linkage would compile
        # fine on master and only surface weeks later when
        # someone runs the breakdown harness. Cheap insurance: a
        # `cargo check` against the same wasm32-wasip1 target the
        # build above already warmed the cache for. Surfaced as a
        # check rather than a build to keep the step under a few
        # seconds — the breakdown workflow exercises the full
        # `cargo build --features trace-startup` path properly.
        run: cargo check --release --target wasm32-wasip1 --no-default-features --features trace-startup -p rubyrs

  panic-budget:
    name: Panic budget (per-file ratchet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Count panics
        # Counts `panic!`, `.unwrap()`, `.expect(` in each rubyrs
        # source file (doc-comment lines starting with `///` or `//!`
        # are excluded — they're text, not code). Per-file budgets
        # were set at P0-4 and may only go down; see
        # docs/PANIC_AUDIT.md for the classification and how to
        # lower a budget.
        run: |
          set -euo pipefail
          fail=0
          check() {
            local file="$1" budget="$2"
            # Strip lines from the first `#[cfg(test)]` onward —
            # in-tree unit tests routinely call `.unwrap()` /
            # `.expect(...)` / `panic!(...)` for fixture assertions,
            # and counting those flips the budget into "ICE-class
            # production sites + arbitrary test churn", which is not
            # what we want to ratchet. The convention here is
            # `#[cfg(test)] mod tests { ... }` at the bottom of each
            # file, so stripping at the first occurrence is safe.
            # Strip leading whitespace before grepping for comment
            # markers so indented doc lines (rare but real) are
            # also excluded.
            local prod
            prod=$(awk '/^#\[cfg\(test\)\]/ {exit} {print}' "$file")
            local count
            count=$(printf '%s\n' "$prod" | grep -cE 'panic!|\.unwrap\(\)|\.expect\(' || true)
            local doc
            doc=$(printf '%s\n' "$prod" | grep -E '^[[:space:]]*(///|//!)' | grep -cE 'panic!|\.unwrap\(\)|\.expect\(' || true)
            count=$((count - doc))
            echo "$file: $count (budget $budget)"
            if [ "$count" -gt "$budget" ]; then
              echo "::error file=$file::Panic budget exceeded: $count > $budget. See docs/PANIC_AUDIT.md."
              fail=1
            fi
          }
          # Bumped 61 → 62 in commit 2c67052 ("Add String#sub/#gsub/#tr"),
          # which inherits `to_chars.last().unwrap()` in the String#tr
          # implementation. Counts merge-result on PR builds, so the
          # +1 lands here on any branch crossing that master commit.
          #
          # Bumped 62 → 64 in master commit 715ecb5 ("Add non-local
          # return + puts-array flatten + bit ops + Enumerable-by +
          # super") which inherits two new sites in vm.rs's super /
          # non-local return paths.
          #
          # Bumped 64 → 66 by Spike L2-2: `cext_invoke_method` uses
          # `.expect("ICE: ...")` on stack-pop (assumed invariant after
          # do_call), and `cext_funcall_to_vm` derefs the documented
          # unsafe vm_ptr via `&mut *vm_ptr` which counts as an
          # `.unwrap()` via the surrounding expectation pattern. Both
          # are ICE-class (programmer-error invariants), not user-
          # reachable; documented in CURRENT_VM_PTR's source comment.
          #
          # Bumped 66 → 68 by Spike L2-3: `cext_handle_to_value`'s new
          # Array and Hash arms each add one `.expect("L2-3 spike:
          # heap cap exhausted ...")` on `Vm::check_alloc`. Proper
          # Trap propagation through the recursive translator is L2.5
          # work tied to widening `cext_handle_to_value` to return
          # Result. Documented at the expect site.
          #
          # Bumped 68 → 70 by PR #8 (metaprogramming PoC): two new
          # ICE-class sites in `Op::DefMethodBlock`'s handler — an
          # `.expect("ICE: ... no block on stack")` on stack-pop and a
          # `panic!("ICE: ... without Block on stack")` on the type
          # check of the popped Value. Both are bytecode-invariant
          # asserts (the preceding `Op::CreateBlock` always pushes a
          # `Value::Block`); not user-reachable.
          #
          # Ratcheted 70 → 68 by Spike L2.5: cext_handle_to_value(_d)
          # now returns `Result<Value, Trap>`. The two heap-cap
          # `.expect(...)` sites become `?` (Copilot reviews #26 /
          # #27), and the depth-limit silent `Value::Nil` substitution
          # becomes `Err(ArgumentError)` (review #24). Net -2 on the
          # budget; ratchet locks the +0 against pre-PR#8 in.
          #
          # Bumped 68 → 70 by master commits a24d7cb (splat in args
          # / rest param) and 0d62f14 (keyword arguments) which
          # added new ICE-class panics in arg-binding paths. Master
          # shipped these without bumping; PR #14 picks them up via
          # the merge-result count.
          #
          # Ratcheted vm.rs from 76 → 0 after the vm/* CRuby-mirrored
          # split. The 76 panics that used to live in the single
          # vm.rs are now distributed across the per-type submodules
          # below; vm.rs itself holds only the Vm struct + shared
          # scaffolding (no panic-class code).
          check crates/rubyrs/src/vm.rs               0
          # Per-submodule budgets — total is 87 (one count higher
          # than the pre-split 76 due to F-series feature work in
          # B6 / F4 / F6 that landed new ICE-class invariants in
          # dispatch + step + iter). The total can ratchet down
          # if/when individual sites become Trap-class.
          # Bumped 16 → 26 (+10) to catch up with accumulated master
          # feature work. New ICE-class `.expect("ICE: ...")` /
          # `panic!("ICE: ...")` sites from: PR #155 (fizzbuzz method
          # cache loop), PR #138 (bignum to_s/sprintf), PR #144
          # (Object#instance_variable_get/set), PR #163 (String#dump),
          # PR #159 (BigInt bit ops), PR #167 (String batch:
          # chars/strip/lstrip/rstrip/start_with?/end_with?), PR #168
          # (String#count), plus the existing UnboundMethod /
          # BoundMethod slot-type ICE panics in do_call_block. All
          # sites are ICE-class (compiler-emitted invariants on
          # stack shape and Op pairing); not user-reachable.
          #
          # Bumped 26 → 27 (+1) by PRs #171 (BigInt phase B7 hash
          # equality) / #172 (Class#singleton_class). One of the
          # universal-eql? / singleton-class arms added a new
          # `.expect("ICE: stack underflow before do_call receiver")`
          # at the receiver pop — same ICE-class shape as the
          # surrounding do_call stack invariants. Bump landed
          # retroactively in this CI-debt-clearance commit because
          # the merging PRs didn't bump.
          #
          # Bumped 27 → 28 (+1) by #192 commit 2/5
          # (`try_dispatch_send_bypass` helper). The unified
          # send-bypass recogniser's caller-side match arm has
          # `recv_opt.expect("with-recv path")` — by construction
          # we passed `Some(recv)` and `SendBypass::NotHandled`
          # returns `recv_opt` unchanged from input, so the
          # expect is ICE-class.
          # Bumped 33 → 47 (+14) — ratchet catch-up after several
          # Tier-1 / Rational / Sinatra-PoC commits landed
          # ICE-class invariants in `do_call`'s NoMethodError-private
          # gate, the Hash/Module/Proc.new `new` interceptors, the
          # `__dir__` arm, the Exception#inspect Exception-detect
          # arm, the lexical-resolution rescue resolver in
          # PushRescue, and the per-arm Rational checked-arith
          # `.ok_or_else(overflow)` sites. All `.expect("ICE: ...")`
          # / `.unwrap()` after `is_some` guards; not user-reachable.
          # Bumped 47 → 48 when PR #318 merged master: the M27 batch
          # (#call-responder Rack app + define_method block capture)
          # added one ICE-class assert on the dispatch path.
          check crates/rubyrs/src/vm/dispatch.rs     48
          # Bumped 52 → 64 by PRs #78 (break/next through ensure —
          # loop-transfer landing arms + frame/stack assertions in
          # the new control-flow ops) and #79 (GlobalVariableRead /
          # StoreGlobal stack-underflow ICE asserts). All sites are
          # ICE-class `.expect("ICE: ...")` invariant checks; not
          # user-reachable.
          #
          # Bumped 64 → 65 by the binary string-literal commit
          # (`feat(vm): preserve raw bytes in \xNN string literals
          # via Op::LoadConstStrBytes`). The new Op consults the
          # current frame's `proto_idx` to index the per-Proto
          # byte_literals pool, gated by `.expect("ICE:
          # LoadConstStrBytes no frame")` — same invariant pattern
          # as every other LoadConst* arm in step.rs.
          # Bumped 65 → 73 (+8) from BigInt Phase B bit-ops work
          # (PR #159) and follow-on string-batch / spec-ingestion
          # PRs landing new `Op::*` arms with ICE-class frame /
          # stack-shape assertions. All sites are `.expect("ICE:
          # ...")` invariants on op pairing; not user-reachable.
          # Bumped 74 → 79 (+5) — ADR 0024 Phase A.4/A.5/A.6/A.9
          # `begin_method_break` + `continue_method_break` machinery
          # added ICE-class `.expect("ICE: pending_method_break
          # vanished mid-walk")` / frame-existence asserts at the
          # walk's suspension + landing sites. Same invariant
          # pattern as the existing `pending_loop_transfer` arms.
          # Bumped 79 → 81 by PR #315 (Sinatra Tier-1 fixes): the
          # `dispatch_until_inner` in-scope unwind arms (non-local
          # return + AlreadyCaught) and the `Op::Raise` bare-`raise`
          # `$!` re-raise added ICE-class frame/state asserts.
          check crates/rubyrs/src/vm/step.rs         81
          # Bumped 10 → 14 (+4) by PR #178 (step-block iter
          # refactor extracting Select/Reject accumulator logic).
          # Each accumulator path adds one `acc_id.unwrap()` —
          # ICE-class because `acc_id: Option<ObjId>` is `Some`
          # by construction before the loop body runs. Same
          # pattern as the existing iter.rs sites.
          # Bumped 14 → 15 (+1) — one ICE-class invariant added by
          # a recent block-iter helper (acc_id `is_some`-then-unwrap
          # pattern, same as the existing 14 sites).
          check crates/rubyrs/src/vm/iter.rs         15
          check crates/rubyrs/src/vm/cext.rs          6
          # Bumped 3 → 10 by PR #78 (break/next through ensure).
          # The proper unwinder needs frame/rescue-stack invariant
          # asserts at the loop-transfer entry, landing, and pop
          # points. All ICE-class; the alternative would be silent
          # corruption when the unwinder state machine diverges
          # from the bytecode's assumption.
          # Bumped 10 → 17 (+7) — ADR 0024 Phase A's
          # `begin_method_break` + `continue_method_break` machinery
          # plus the rescue-handler `pending_method_break.is_none`
          # ICE-class asserts. All `.expect("ICE: ...")` invariants
          # at frame / pending-slot transitions; not user-reachable.
          check crates/rubyrs/src/vm/raise.rs        17
          check crates/rubyrs/src/vm/lookup.rs        3
          check crates/rubyrs/src/vm/range.rs         1
          # Bumped 1 → 4 (+3) from PR #163 (String#dump — hex pair
          # `char::from_digit(N, 16).unwrap()` for high/low nibbles)
          # and PR #163 / #168 regex caps and String#tr last-char
          # invariants. All sites are ICE-class — radix < 16 by
          # construction, `caps.get(0)` always Some on a successful
          # match, `to_chars.last()` after a non-empty validation.
          #
          # Bumped 4 → 5 (+1) by PR #178 (step-block iter refactor
          # migrating String#scan to the shared block iter helper).
          # The migration adds one more `caps.get(0).unwrap()` at
          # the scan branch — same regex-caps ICE pattern as the
          # existing String#match site.
          # Bumped 5 → 10 (+5) — `String#dump` hex-pair nibble
          # construction (`char::from_digit(hi/lo, 16).unwrap()`),
          # the `String#tr` `to_chars.last().unwrap()` after an
          # `is_empty` guard, and the `String#scan` /
          # `String#match` `caps.get(0).unwrap()` after a successful
          # regex match. All ICE-class — the guard above each
          # unwrap makes Some statically true.
          check crates/rubyrs/src/vm/string.rs       10
          # The remaining vm/* submodules (array, fileops, gc, hash,
          # numeric, primitive, sprintf, util) have zero panic-class
          # sites; ratcheting them at 0 keeps them honest.
          # Bumped 0 → 1 (+1) by PR #179 (Array#delete) — one
          # `hits.last().unwrap()` after a `hits.is_empty()`
          # short-circuit higher up the same branch. ICE-class;
          # the empty-vec guard makes the unwrap statically safe.
          check crates/rubyrs/src/vm/array.rs         1
          check crates/rubyrs/src/vm/fileops.rs       0
          check crates/rubyrs/src/vm/gc.rs            0
          check crates/rubyrs/src/vm/hash.rs          0
          # Bumped 0 → 5 by PR #66 (require .rb) + PR #78
          # (break/next through ensure). The require/_relative
          # method-return + class_eval unwind path needs the same
          # class_stack / frame invariant asserts that the main
          # dispatch loop has in step.rs. ICE-class.
          check crates/rubyrs/src/vm/kernel.rs        10
          # Bumped 0 → 3 (+3) for two ICE-class invariants in
          # `Integer#to_s(radix)` (radix validated to 2..=36 at
          # the entry guard so `digit < radix` and "ASCII digits +
          # sign" both hold by construction) plus one
          # `.expect("ICE: bigint_arith None for Int operands")`
          # in `apply_int_promote`'s overflow path — fall-through
          # is impossible under `feature = "bignum"` because that
          # arm only fires after `apply_int` returned None.
          check crates/rubyrs/src/vm/numeric.rs       3
          check crates/rubyrs/src/vm/primitive.rs     0
          check crates/rubyrs/src/vm/sprintf.rs       0
          check crates/rubyrs/src/vm/util.rs          0
          # Bumped 10 → 12 by Spike L3-B: heap.rs gains the
          # `typed_data(id)` and `class_of(id)` accessors that
          # `panic!("ICE: ...")` on slot-type mismatch — same
          # ICE-class invariant pattern as the existing
          # `instance(id)` etc. accessors.
          #
          # Bumped 12 → 13 by F6: the eigenclass accessor on
          # Instance.singleton_class adds one more ICE-class
          # accessor in the same shape.
          # Bumped 15 → 20 (+5) from the slot-type accessor surface
          # expanding to cover Hash default block / default value
          # (PR #144 ivar work consumes them), CurriedProc,
          # UnboundMethod variants — same "ICE: heap slot is not
          # an X" pattern as the existing 15 accessors. All 🟡:
          # programmer-error if a wrong-typed ObjId reaches the
          # accessor.
          # Bumped 22 → 24 (+2) — two more slot-type accessors on
          # heap (Range / TypedData internals) added the same
          # `panic!("ICE: heap slot is not an X")` shape as the
          # existing accessors. Programmer-error class — wrong-typed
          # ObjId reaching the accessor.
          check crates/rubyrs/src/heap.rs            24
          # Bumped 3 → 6 by master commits a5d61f1 / cc89211 / 92feabb
          # (multi-write assignment, splat receive, op-assignment forms)
          # which added new ICE-class panics in ast::tr for partially-
          # supported assignment shapes. Master never bumped the budget
          # itself; PR #6 picks the increase up because it merges those
          # commits. All three sites are user-reachable
          # "unsupported AST" paths that ideally become Trap, tracked
          # in docs/PANIC_AUDIT.md.
          #
          # Bumped 6 → 7 by a master commit that added one more
          # ICE-class panic in ast::tr (master shipped red on its
          # own CI without bumping the budget — PR #14 picks up
          # the increase via the merge-result count). Pre-existing
          # master bug, not introduced by this PR.
          check crates/rubyrs/src/ast.rs       8
          # Bumped 1 → 10 (+9) — net of two waves:
          #
          #   (a) +3 from PRs that added pure-Ruby preamble files
          #       (`preamble/random.rb`, `preamble/securerandom.rb`,
          #       `preamble/time.rb`). Each adds one
          #       `.expect("ICE: failed to load X preamble")` on
          #       the eval. The PRs that landed those never bumped
          #       this budget; the count went from 1 to 4 silently
          #       across two PR cycles before either was flagged.
          #
          #   (b) +6 from the preamble externalisation series
          #       (`aceebaf` exceptions, `5072eb4` Object,
          #       `bb7b24f` Comparable, `ce9ea1e` MatchData,
          #       `201e7ea` Mutex, `0cacb96` Enumerable). Each
          #       commit lifted a class definition out of the
          #       inline raw-string PREAMBLE into its own
          #       `preamble/*.rb` file, adding one
          #       `.expect("ICE: failed to load X preamble")` on
          #       the eval per file. The author (this branch)
          #       didn't bump per-commit; bumping retroactively
          #       here.
          #
          # All 10 sites are 🟢 ICE-class — preamble Ruby is
          # author-controlled at compile time (the .rb files
          # live in-tree, sanity-checked by `prism check`), not
          # user input. A failed eval there means rubyrs itself
          # is broken; aborting with a clear `ICE:` message is
          # correct surface.
          #
          # Bumped 10 → 11 (+1) by PR #184 (Thread.current stub —
          # adds `preamble/thread.rb` for the Tier 1 `Thread`
          # class shell). Same `.expect("ICE: failed to load X
          # preamble")` pattern as the other 10 preamble loads.
          # Bumped 11 → 14 (+3) — three more preamble loads
          # (`preamble/comparable.rb`, `preamble/match_data.rb`,
          # `preamble/throw_catch.rb`) added one
          # `.expect("ICE: failed to load X preamble")` each.
          # Same author-controlled-source ICE pattern as the other
          # 11 preamble loads.
          # Bumped 14 → 15 by PR #315: the `preamble/throw_catch.rb`
          # load (Kernel#catch/#throw) adds its own
          # `.expect("ICE: failed to load throw/catch preamble")`.
          check crates/rubyrs/src/lib.rs       15
          # Bumped from 1 → 2 in 8cfe48b ("Add default method arguments")
          # which introduced literal_to_value's ICE panic. The ratchet
          # never went down, just up here. See docs/PANIC_AUDIT.md.
          #
          # Bumped 2 → 6 by PR #78 (break/next through ensure) and
          # PR #81 (ConstantPath op-write family). The compiler
          # gains `loop_next_jumps` / `loop_break_jumps` stack
          # invariants — paired push/pop at each `while` scope plus
          # `last_mut().expect("ICE: just checked")` after the
          # is_empty guard. ICE-class; the guards make the invariant
          # statically true on each access.
          # Bumped 6 → 7 (+1) from a recent feature commit adding
          # one more ICE-class invariant in the compiler (the
          # `loop_break_jumps.last_mut().expect("ICE: just
          # checked")` pattern that pairs with the existing
          # loop-scope push/pop dance). ICE-class; the
          # `is_empty()` guard above each `last_mut()` makes the
          # invariant statically true.
          # Bumped 7 → 9 when PR #318 merged master: the M27 batch
          # (middle-splat `a, *b, c` + legacy `Module#attr`) added two
          # ICE-class asserts in the compiler.
          check crates/rubyrs/src/compiler.rs  9
          exit "$fail"

  perf-budget:
    name: Perf budget (peak-RSS ratchet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Build (release)
        # Release-mode is required — the baselines were measured
        # against optimised builds. Debug builds would blow every
        # RSS budget and tell us nothing useful.
        run: cargo build --release -p rubyrs

      - name: Check peak-RSS budgets
        # Runs each workload in perf/baselines.tsv three times,
        # compares MIN peak-RSS to the row's budget, fails if any
        # exceed. Wall-time is collected but not gated here — see
        # perf/README.md for the rationale and ratchet etiquette.
        run: perf/check.sh

  json-perf-budget:
    name: Perf budget (JSON bench per-iter)
    runs-on: ubuntu-latest
    # Standalone from the script-level `perf-budget` job for the
    # same reason `framework-parity` is standalone from `Test`:
    # this gate has a different build (needs `_json_native` +
    # `stdlib` features, not the default Tier-1 binary the
    # peak-RSS gate measures) and a different failure mode (per-
    # iter µs budget, not whole-script wall + RSS). Folding them
    # into one job would require feature-toggling rebuilds in
    # the middle, which negates the per-job cache key.
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Separate cache key from `perf-budget` because the
          # feature set differs — sharing the cache would
          # invalidate one job's target/ on every push from the
          # other.
          key: ${{ runner.os }}-cargo-json-perf-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-json-perf-

      - name: Build (release, _json_native enabled)
        # Same feature set the framework-parity job uses for the
        # json_canon fixture — keeps the binary under perf gate
        # byte-identical to the one under parity gate, so a
        # parity-side fix and a perf-side fix can't accidentally
        # be measuring different binaries.
        run: |
          cargo build --release -p rubyrs \
            --features default,stdlib,_http_server,_fiber,_json_native

      - name: Check JSON bench per-iter budgets
        # Runs bench/json_bench.rb 3× under reduced ITERS (2000
        # vs the README default 5000) for sub-3 s gate wall;
        # the min-of-runs absorbs warm-up + GC the same way the
        # peak-RSS gate does. Budgets in
        # bench/json_bench_baselines.tsv per-metric.
        run: bash bench/json_bench_check.sh

  miri:
    name: Miri smoke (Stacked + Tree Borrows)
    # ADR 0013 documents the CURRENT_VM_PTR raw-pointer escape
    # used for cext re-entrance. Runs Miri against every test
    # subset that does NOT touch Prism (vendored C — Miri can't
    # execute foreign code) or `dlopen`, under both default
    # Stacked Borrows and `-Zmiri-tree-borrows`. A regression
    # in the non-cext Vm code would land red here; the cext
    # dispatch path itself is documented as Miri-unverifiable
    # (see ADR 0013's "Miri verification record").
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust nightly + Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src

      - name: Cache cargo + miri sysroot
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-miri-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-miri-

      - name: Miri setup
        run: cargo +nightly miri setup

      - name: Miri (Stacked Borrows) — vm/* unit tests
        run: |
          cargo +nightly miri test --lib -p rubyrs vm::lookup::
          cargo +nightly miri test --lib -p rubyrs vm::gc::
          cargo +nightly miri test --lib -p rubyrs vm::raise::

      - name: Miri (Stacked Borrows) — cext reentrance + FFI tests
        # vm::cext::miri_tests covers the CURRENT_VM_PTR
        # reborrow shape that the actual cext path uses (ADR
        # 0013); rubyrs-cext::safety_negative covers per-fn
        # FFI surface. Neither hits dlopen, so both are
        # Miri-runnable.
        run: |
          cargo +nightly miri test --lib -p rubyrs vm::cext::miri_tests::
          cargo +nightly miri test -p rubyrs-cext --test safety_negative

      - name: Miri (Tree Borrows) — same subset
        env:
          MIRIFLAGS: "-Zmiri-tree-borrows"
        run: |
          cargo +nightly miri test --lib -p rubyrs vm::lookup::
          cargo +nightly miri test --lib -p rubyrs vm::gc::
          cargo +nightly miri test --lib -p rubyrs vm::raise::
          cargo +nightly miri test --lib -p rubyrs vm::cext::miri_tests::
          cargo +nightly miri test -p rubyrs-cext --test safety_negative

  coverage:
    name: Coverage (per-file ratchet)
    # Same ratchet philosophy as panic-budget / perf-budget: per-file
    # baselines stored in-tree; CI fails if any file drops below
    # `baseline - tolerance_pct`. The tolerance absorbs sub-1% noise from
    # minor refactors; intentional drops are reviewed via the baseline-
    # JSON diff. See docs/COVERAGE.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain (pinned to rust-toolchain.toml)
        # Mirror the wasm job's pattern (.github/workflows/ci.yml:124-141)
        # rather than using `@stable`. Cargo runs under rust-toolchain.toml's
        # pin (1.95), so installing `llvm-tools-preview` on stable would land
        # the component on a channel cargo doesn't use; cargo-llvm-cov
        # currently self-heals by rustup-component-add'ing on first run
        # under 1.95, but pinning here is the explicit contract and avoids
        # the implicit fallback.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          components: llvm-tools-preview

      - name: Install Ruby (oracle for diff tests)
        # The same diff-vs-CRuby integration tests the `test` job uses;
        # without Ruby on PATH they're skipped, which would deflate the
        # measured coverage and force a baseline lowering on every run.
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Cache cargo registry + cargo-llvm-cov
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-llvm-cov
            target
          # Separate cache key from `test` job — the coverage job needs
          # an INSTRUMENTED build (rustc-LLVM-cov flags differ), so its
          # target/ artifacts shouldn't share with the release-built test
          # job's cache or each would invalidate the other's.
          #
          # The pinned cargo-llvm-cov version is embedded in the key so a
          # version bump (below) bust-invalidates the cache and forces a
          # fresh install on the next run. Without this, a cache hit would
          # serve the OLD binary indefinitely even after the workflow's
          # version pin moved.
          key: ${{ runner.os }}-cargo-coverage-llvm-cov-0.8.7-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-coverage-llvm-cov-0.8.7-

      - name: Install cargo-llvm-cov
        # Version is PINNED so the coverage measurement tool is the same
        # binary across runs. The ratchet compares per-file line% against
        # an in-tree baseline — if cargo-llvm-cov instrumentation or
        # LCOV-emission semantics change (between releases, or by the
        # CI picking up "whatever's latest on crates.io" on a cache miss),
        # the baselines would shift without anyone touching the code.
        # Bumping this pin should be a deliberate PR that also reruns
        # `--update` against the new tool's output.
        #
        # 0.8.7 is the version that produced the seeded
        # crates/rubyrs/coverage_baseline.json; keep them in lockstep.
        run: |
          if ! command -v cargo-llvm-cov >/dev/null; then
            cargo install cargo-llvm-cov --locked --version 0.8.7
          fi
          cargo llvm-cov --version

      - name: Generate LCOV report
        # `--workspace` covers every crate in the workspace; the ratchet
        # script filters to `crates/` so registry-built deps don't pollute
        # the baseline. `--lcov` is the standard format and matches the
        # ratchet's parser. `--all-targets` covers integration tests too
        # (under tests/), which exercise embed-API surfaces the unit
        # tests miss. STRESS_GC stays OFF here — coverage doesn't care
        # about GC pressure, and the extra runtime cost is wasted.
        run: cargo llvm-cov --workspace --all-targets --lcov --output-path lcov.info

      - name: Ratchet per-file coverage
        # Compares parsed LCOV against crates/rubyrs/coverage_baseline.json.
        # Fails on any file below `baseline - tolerance_pct` (1.0% default).
        # New source files without a baseline also fail — the host adds
        # them via `python3 scripts/coverage_ratchet.py --update` after
        # measuring locally; the baseline diff lands in the PR.
        run: python3 scripts/coverage_ratchet.py --lcov lcov.info --baseline crates/rubyrs/coverage_baseline.json

      - name: Upload LCOV artifact
        # Available for download from the Actions UI so reviewers can
        # inspect the per-line picture when investigating a regression.
        # The actions/upload-artifact@v4 default is 90 days (or org-
        # configured), not 30 — set retention-days explicitly so the
        # contract matches docs/COVERAGE.md and this workflow comment.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcov-${{ github.run_id }}
          path: lcov.info
          retention-days: 30

  framework-parity:
    name: Framework parity (smoke)
    # M27 D / ADR 0026 v2 §"Compatibility contract" — the
    # "same code runs on both" claim becomes a CI gate. Each menu
    # item gets a fixture under
    # `crates/rubyrs/tests/diff_framework/fixtures/`; the test
    # spawns rubyrs and CRuby side-by-side, replays a declarative
    # route matrix, and byte-diffs the response transcripts after
    # an optional normalisation pass.
    #
    # Standalone job (not folded into `Test`) per ADR 0026 v2
    # §Negative consequences "tiered parity (smoke per PR, full
    # matrix nightly)": a gem-install / upstream-version flake
    # here should NOT block core regressions, and each menu item
    # (Sinatra now, JSON / ActiveSupport-lite / Sequel-lite next)
    # adds a row to this job's matrix, not the Test job's.
    #
    # Smoke tier: ubuntu only, one Ruby version. Two fixtures so
    # far: `hello_smoke` (stdlib-only Rack-shape, gates harness
    # correctness) and `sinatra_hello` (18-route Sinatra matrix,
    # gates the M27 menu's omakase Sinatra parity claim).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Ruby
        # 3.4 to match the `Test` job above so the parity oracle
        # tracks the same MRI version the rest of CI runs against.
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Install parity-matrix gems
        # Two CRuby fixtures need explicit gems:
        #   - `fixtures/hello_smoke/compat.rb` does `require
        #     "webrick"` directly (no Sinatra in scope) — Webrick
        #     was unbundled from Ruby's stdlib in 3.0+ so the CI
        #     image's Ruby 3.4 doesn't ship it preinstalled.
        #   - `fixtures/sinatra_hello/` needs Sinatra plus a
        #     server fallback. Sinatra 4.x's runtime deps are
        #     rack / rack-protection / tilt / mustermann /
        #     ruby2_keywords — webrick is NOT among them.
        #
        # An earlier version of this step claimed `gem install
        # sinatra` pulled in webrick transitively and ran CI red
        # against `cannot load such file -- webrick (LoadError)`
        # from hello_smoke (which has no sinatra context).
        # Install both explicitly to cover both fixtures.
        run: gem install webrick sinatra

      - name: Cache cargo registry + build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-parity-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build flori-json-cext bundles (json_smoke fixture)
        # `fixtures/json_smoke/` requires the flori-json-cext
        # parser bundle on the rubyrs side; without it the harness
        # skip-not-fails the fixture. build.sh recompiles rubyrs
        # first (cheap — the test job below also builds release),
        # then compiles the vendored flori/json sources with the
        # rubyrs cext header shims. PROFILE=release matches the
        # binary the framework-parity tests will dlopen against.
        run: PROFILE=release bash crates/rubyrs/examples/flori-json-cext/build.sh

      - name: Run framework-parity tests
        # The diff_framework binary is `#[cfg(feature =
        # "_http_server")]` so the harness only compiles with the
        # battery enabled — feature gate matches the menu's actual
        # Tier-3 dependency. `_fiber` is bundled so streaming-
        # capable fixtures work end-to-end. `stdlib` activates the
        # embedded pure-Ruby canon (src/stdlib_vendor/*.rb) so
        # fixtures like `json_canon` resolve `require "json"` to
        # the in-tree JSON impl rather than the lenient stub.
        # `_json_native` registers the serde_json accelerator —
        # `json_canon` then exercises the native parse/generate
        # path (the same one users get with `--features
        # _json_native` in production), so any byte-diff drift
        # between the canon and the accelerator surfaces on
        # every PR rather than only in nightly bench. Other
        # features (cext, regex, bignum) come from
        # `--features default`.
        run: |
          cargo test --release \
            --features default,stdlib,_http_server,_fiber,_json_native \
            --test diff_framework \
            -- --nocapture

  supply-chain:
    name: Supply-chain (cargo-deny)
    # Sister to panic-budget / perf-budget / coverage ratchets:
    # catches a dep introducing a CVE, license-policy violation,
    # or banned-crate at PR time rather than at audit time.
    # Config lives at the workspace-root `deny.toml`; see that
    # file's header for the bump-a-rule etiquette.
    #
    # Standalone job (not folded into `Test`) for the same
    # reason `framework-parity` is standalone: a transient RustSec
    # advisory-DB flake or an upstream-license clarification
    # shouldn't block core regressions. cargo-deny pulls advisory
    # data on every run, so a network hiccup at the registry
    # would otherwise cascade into the main Test job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        # Pin via `cargo install` rather than the upstream
        # `EmbarkStudios/cargo-deny-action` so the workflow stays
        # self-contained and version-explicit. The pin is also
        # explicit so a future cargo-deny rule-set change can't
        # silently flip CI red. Bumping the pin is a deliberate
        # commit that re-runs `cargo deny check` locally to
        # confirm the new ruleset still passes.
        run: |
          if ! command -v cargo-deny >/dev/null; then
            cargo install cargo-deny --locked --version 0.19.8
          fi
          cargo deny --version

      - name: Run cargo-deny checks
        # `cargo deny check` runs all four categories
        # (advisories, licenses, bans, sources) per the
        # workspace-root deny.toml. Exits non-zero on any rule
        # violation; the message names the offending crate +
        # version + which rule fired.
        run: cargo deny check
