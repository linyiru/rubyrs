name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Ruby (oracle for diff tests)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Cache cargo registry + build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: GC rooting lint (issue #90)
        # Structural grep gate for the recurring "unrooted Value
        # held across `self.maybe_gc` + `self.heap.alloc`" hazard
        # — see issue #90 for the seven prior incidents this is
        # meant to prevent recurrence of. Heuristic but cheap;
        # every false-positive can be silenced with an inline
        # `// allow: gc-rooting — <reason>` annotation.
        run: bash scripts/lint-gc-rooting.sh

      - name: Clippy (workspace, -D warnings)
        # Catches the style / pedantic lints that `cargo build`
        # won't notice. The workspace is at zero warnings as of
        # the May 2026 cleanup pass; this step is the wall that
        # keeps it there. Build / test already enforce -D warnings
        # at compile time via RUSTFLAGS, but neither runs clippy
        # itself, so the lints would silently regress without this.
        run: cargo clippy --release --all-targets --workspace -- -D warnings

      - name: Build
        run: cargo build --release --verbose

      - name: Run tests
        # Includes integration tests cext_hello + cext_bcrypt, which
        # build native C extensions through `bash build.sh`. Those
        # invocations need the host's C toolchain (gcc on ubuntu,
        # apple clang on macos) — both preinstalled on the runner —
        # plus the vendored crypt_blowfish source (tracked in
        # examples/bcrypt-cext/vendor/). The bcrypt test then runs
        # three Openwall-published bcrypt reference vectors end to
        # end through rubyrs and asserts byte-identical output.
        # Failure here means a regression in the cext FFI, not just
        # the language.
        run: cargo test --release --verbose

      - name: Run tests (STRESS_GC=1)
        run: cargo test --release --verbose
        env:
          STRESS_GC: "1"

      - name: Verify cext example bundles build
        # Belt-and-suspenders: even if the integration tests changed
        # paths or were skipped, this step independently runs each
        # cext build script and asserts the .bundle/.so artifact got
        # produced. Without this a partial regression in build.sh
        # (e.g. a missing -D flag) could ship as "tests passed".
        run: |
          set -euo pipefail
          bash crates/rubyrs/examples/hello-cext/build.sh
          bash crates/rubyrs/examples/bcrypt-cext/build.sh
          bash crates/rubyrs/examples/self-cext/build.sh
          bash crates/rubyrs/examples/callback-cext/build.sh
          bash crates/rubyrs/examples/raise-cext/build.sh
          bash crates/rubyrs/examples/counter-cext/build.sh
          bash crates/rubyrs/examples/mini-json-cext/build.sh
          ext=$([ "$(uname -s)" = "Darwin" ] && echo bundle || echo so)
          test -f "crates/rubyrs/examples/hello-cext/hello.$ext"
          test -f "crates/rubyrs/examples/bcrypt-cext/bcrypt_ext.$ext"
          test -f "crates/rubyrs/examples/self-cext/self_test.$ext"
          test -f "crates/rubyrs/examples/callback-cext/callback_ext.$ext"
          test -f "crates/rubyrs/examples/raise-cext/raise_ext.$ext"
          test -f "crates/rubyrs/examples/counter-cext/counter_ext.$ext"
          test -f "crates/rubyrs/examples/mini-json-cext/mini_json.$ext"

  wasm:
    name: Build (wasm32-wasip1)
    # docs/DEVELOPMENT.md advertises wasm32-wasip1 as a supported
    # target. This job proves we don't quietly break that with cext
    # changes — particularly that the crate stays wasi-portable
    # with the `cext` feature off.
    #
    # We deliberately build with `--no-default-features` because
    # `cext` requires a dynamic loader (libloading + dlopen) that
    # wasm32-wasi does not have. PR #75 made that combination a
    # `build.rs` panic so users get a clear diagnostic instead of
    # a silently stub-only binary; this job therefore exercises the
    # `--no-default-features` path, which is the only meaningful
    # wasm32-wasi shape (see ADR 0015).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain (wasm32-wasip1 target)
        # `dtolnay/rust-toolchain@stable` would install rust-std for
        # the *stable* channel — but `rust-toolchain.toml` in this
        # repo pins the build to 1.95, so cargo would run under 1.95
        # while the wasm32-wasip1 std lived on stable, producing
        # "can't find crate for `core`" (E0463). Pin to 1.95
        # explicitly here so the target install lands on the same
        # channel cargo will actually run under.
        #
        # The duplication with `rust-toolchain.toml` is unavoidable:
        # `dtolnay/rust-toolchain@master` treats `toolchain` as a
        # required input (the action errors with "toolchain is a
        # required input" if omitted). If/when rust-toolchain.toml
        # bumps, both places need updating in lockstep.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          targets: wasm32-wasip1

      - name: Cache cargo + wasi-sdk
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            /opt/wasi-sdk-24.0-x86_64-linux
          key: ${{ runner.os }}-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-wasm-

      - name: Install wasi-sdk 24
        # crates/rubyrs/build.rs compiles a tiny `__wasi_init_tp`
        # stub via the `cc` crate on the wasm32-wasi target. That
        # needs a wasi-aware C compiler. wasi-sdk 24 matches the
        # version documented in docs/DEVELOPMENT.md.
        run: |
          set -euo pipefail
          if [ ! -d /opt/wasi-sdk-24.0-x86_64-linux ]; then
            curl -L https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-24/wasi-sdk-24.0-x86_64-linux.tar.gz \
              | sudo tar -xz -C /opt
          fi
          echo "WASI_SDK_PATH=/opt/wasi-sdk-24.0-x86_64-linux" >> $GITHUB_ENV

      - name: Install binaryen (wasm-opt)
        # `perf/wasm_check.sh` runs `wasm-opt -Oz` on the built
        # rubyrs.wasm before the AOT-compile step. Without binaryen
        # the script falls back to skipping the -Oz pass (PASS still
        # works), but having it installed makes the CI cwasm match
        # the shipping shape and cuts ~13% off the cwasm size.
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y binaryen

      - name: Install wizer
        # `perf/wasm_check.sh` runs wizer between wasm-opt and
        # `wasmtime compile` to pre-initialize the Runtime
        # (classes + preamble bytecode) and snapshot linear
        # memory. Without wizer the script skips the pass and
        # still PASSes; with it, cold start drops ~0.5 ms
        # (~5% relative at sub-10 ms scale). Bump version +
        # checksum together when the toolchain pin moves.
        run: |
          set -euo pipefail
          WIZER_VERSION=v11.0.3
          WIZER_SHA256=36016e7f846f38ad09f22eb4bafb99068f038c431eb9613ddf59e31ad8a21414
          TARBALL="wizer-${WIZER_VERSION}-x86_64-linux.tar.xz"
          URL="https://github.com/bytecodealliance/wizer/releases/download/${WIZER_VERSION}/${TARBALL}"
          curl -sSLo "$TARBALL" "$URL"
          echo "${WIZER_SHA256}  ${TARBALL}" | sha256sum -c -
          tar xf "$TARBALL"
          mkdir -p "$HOME/.local/bin"
          install -m 755 "wizer-${WIZER_VERSION}-x86_64-linux/wizer" "$HOME/.local/bin/wizer"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install wasmtime
        # End-to-end smoke (next step) needs a wasi runtime. Pin a
        # specific release + verify a sha256 over the downloaded
        # tarball so the CI lane doesn't trust an arbitrary remote
        # install script. Bump version + checksum together when
        # `tests/wasm/smoke.sh` starts exercising newer wasi
        # proposals.
        run: |
          set -euo pipefail
          WASMTIME_VERSION=v45.0.0
          WASMTIME_SHA256=9d92e6dc04630f617e0e5d532327a5a917ac4898587e07f4fb7a5fc7fffef760
          TARBALL="wasmtime-${WASMTIME_VERSION}-x86_64-linux.tar.xz"
          URL="https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/${TARBALL}"
          curl -sSLo "$TARBALL" "$URL"
          echo "${WASMTIME_SHA256}  ${TARBALL}" | sha256sum -c -
          tar xf "$TARBALL"
          install -m 755 "wasmtime-${WASMTIME_VERSION}-x86_64-linux/wasmtime" "$HOME/.local/bin/wasmtime" 2>/dev/null \
            || (mkdir -p "$HOME/.local/bin" && install -m 755 "wasmtime-${WASMTIME_VERSION}-x86_64-linux/wasmtime" "$HOME/.local/bin/wasmtime")
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build + smoke (wasm32-wasip1)
        # Drives both:
        # 1. `cargo build --release --target wasm32-wasip1 -p rubyrs
        #    --no-default-features` (proves the non-cext core stays
        #    wasi-portable; `libloading` and `rubyrs-cext` are
        #    correctly opt-in via the `cext` feature; `Kernel#require`
        #    returns a clear non-cext trap rather than panicking).
        # 2. wasmtime-runs `tests/wasm/smoke.rb` against the built
        #    `.wasm` and diffs stdout against `smoke.expected`. This
        #    is the proof that wasm32-wasip1 isn't just compile-clean
        #    but actually executes end-to-end — covering puts /
        #    interpolation / Range / Array / Hash / rescue / while
        #    break / class def in one tight fixture.
        run: bash crates/rubyrs/tests/wasm/smoke.sh

      - name: Diff matrix (wasm32-wasip1 vs CRuby)
        # Third leg of the wasm correctness ladder (compile → smoke
        # → matrix). Runs a curated subset of
        # `crates/rubyrs/tests/diff/*.rb` fixtures under BOTH `ruby`
        # and `rubyrs.wasm`, asserts byte-identical stdout. Catches
        # native-vs-wasi behaviour drift the smoke fixture's one
        # script can't surface. Manifest at
        # `crates/rubyrs/tests/wasm/diff_manifest.txt`; ruby is
        # preinstalled on ubuntu-latest so no extra setup step here.
        # `diff_matrix.sh` invokes `cargo build` again — cargo's
        # incremental rebuild is a no-op after the previous smoke
        # step, so the duplicate invocation is cheap.
        run: bash crates/rubyrs/tests/wasm/diff_matrix.sh

      - name: Perf gate (wasm32-wasip1 wall time)
        # Fourth leg of the wasm ladder (compile → smoke → matrix →
        # perf). The script runs wasm-opt -Oz on the built .wasm
        # (size pass), wasmtime-compiles to .cwasm (AOT — no JIT
        # cost per invocation), then times each workload in
        # `perf/wasm_baselines.tsv` three times under
        # `wasmtime run --allow-precompiled`, takes min wall, and
        # fails if it exceeds the row's budget. Same absolute-
        # baseline policy as `perf/check.sh` (the native gate);
        # `perf/wasm_baselines.tsv` documents bumping etiquette
        # and the calibration sources.
        run: bash perf/wasm_check.sh

  panic-budget:
    name: Panic budget (per-file ratchet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Count panics
        # Counts `panic!`, `.unwrap()`, `.expect(` in each rubyrs
        # source file (doc-comment lines starting with `///` or `//!`
        # are excluded — they're text, not code). Per-file budgets
        # were set at P0-4 and may only go down; see
        # docs/PANIC_AUDIT.md for the classification and how to
        # lower a budget.
        run: |
          set -euo pipefail
          fail=0
          check() {
            local file="$1" budget="$2"
            # Strip lines from the first `#[cfg(test)]` onward —
            # in-tree unit tests routinely call `.unwrap()` /
            # `.expect(...)` / `panic!(...)` for fixture assertions,
            # and counting those flips the budget into "ICE-class
            # production sites + arbitrary test churn", which is not
            # what we want to ratchet. The convention here is
            # `#[cfg(test)] mod tests { ... }` at the bottom of each
            # file, so stripping at the first occurrence is safe.
            # Strip leading whitespace before grepping for comment
            # markers so indented doc lines (rare but real) are
            # also excluded.
            local prod
            prod=$(awk '/^#\[cfg\(test\)\]/ {exit} {print}' "$file")
            local count
            count=$(printf '%s\n' "$prod" | grep -cE 'panic!|\.unwrap\(\)|\.expect\(' || true)
            local doc
            doc=$(printf '%s\n' "$prod" | grep -E '^[[:space:]]*(///|//!)' | grep -cE 'panic!|\.unwrap\(\)|\.expect\(' || true)
            count=$((count - doc))
            echo "$file: $count (budget $budget)"
            if [ "$count" -gt "$budget" ]; then
              echo "::error file=$file::Panic budget exceeded: $count > $budget. See docs/PANIC_AUDIT.md."
              fail=1
            fi
          }
          # Bumped 61 → 62 in commit 2c67052 ("Add String#sub/#gsub/#tr"),
          # which inherits `to_chars.last().unwrap()` in the String#tr
          # implementation. Counts merge-result on PR builds, so the
          # +1 lands here on any branch crossing that master commit.
          #
          # Bumped 62 → 64 in master commit 715ecb5 ("Add non-local
          # return + puts-array flatten + bit ops + Enumerable-by +
          # super") which inherits two new sites in vm.rs's super /
          # non-local return paths.
          #
          # Bumped 64 → 66 by Spike L2-2: `cext_invoke_method` uses
          # `.expect("ICE: ...")` on stack-pop (assumed invariant after
          # do_call), and `cext_funcall_to_vm` derefs the documented
          # unsafe vm_ptr via `&mut *vm_ptr` which counts as an
          # `.unwrap()` via the surrounding expectation pattern. Both
          # are ICE-class (programmer-error invariants), not user-
          # reachable; documented in CURRENT_VM_PTR's source comment.
          #
          # Bumped 66 → 68 by Spike L2-3: `cext_handle_to_value`'s new
          # Array and Hash arms each add one `.expect("L2-3 spike:
          # heap cap exhausted ...")` on `Vm::check_alloc`. Proper
          # Trap propagation through the recursive translator is L2.5
          # work tied to widening `cext_handle_to_value` to return
          # Result. Documented at the expect site.
          #
          # Bumped 68 → 70 by PR #8 (metaprogramming PoC): two new
          # ICE-class sites in `Op::DefMethodBlock`'s handler — an
          # `.expect("ICE: ... no block on stack")` on stack-pop and a
          # `panic!("ICE: ... without Block on stack")` on the type
          # check of the popped Value. Both are bytecode-invariant
          # asserts (the preceding `Op::CreateBlock` always pushes a
          # `Value::Block`); not user-reachable.
          #
          # Ratcheted 70 → 68 by Spike L2.5: cext_handle_to_value(_d)
          # now returns `Result<Value, Trap>`. The two heap-cap
          # `.expect(...)` sites become `?` (Copilot reviews #26 /
          # #27), and the depth-limit silent `Value::Nil` substitution
          # becomes `Err(ArgumentError)` (review #24). Net -2 on the
          # budget; ratchet locks the +0 against pre-PR#8 in.
          #
          # Bumped 68 → 70 by master commits a24d7cb (splat in args
          # / rest param) and 0d62f14 (keyword arguments) which
          # added new ICE-class panics in arg-binding paths. Master
          # shipped these without bumping; PR #14 picks them up via
          # the merge-result count.
          #
          # Ratcheted vm.rs from 76 → 0 after the vm/* CRuby-mirrored
          # split. The 76 panics that used to live in the single
          # vm.rs are now distributed across the per-type submodules
          # below; vm.rs itself holds only the Vm struct + shared
          # scaffolding (no panic-class code).
          check crates/rubyrs/src/vm.rs               0
          # Per-submodule budgets — total is 87 (one count higher
          # than the pre-split 76 due to F-series feature work in
          # B6 / F4 / F6 that landed new ICE-class invariants in
          # dispatch + step + iter). The total can ratchet down
          # if/when individual sites become Trap-class.
          check crates/rubyrs/src/vm/dispatch.rs     16
          # Bumped 52 → 64 by PRs #78 (break/next through ensure —
          # loop-transfer landing arms + frame/stack assertions in
          # the new control-flow ops) and #79 (GlobalVariableRead /
          # StoreGlobal stack-underflow ICE asserts). All sites are
          # ICE-class `.expect("ICE: ...")` invariant checks; not
          # user-reachable.
          #
          # Bumped 64 → 65 by the binary string-literal commit
          # (`feat(vm): preserve raw bytes in \xNN string literals
          # via Op::LoadConstStrBytes`). The new Op consults the
          # current frame's `proto_idx` to index the per-Proto
          # byte_literals pool, gated by `.expect("ICE:
          # LoadConstStrBytes no frame")` — same invariant pattern
          # as every other LoadConst* arm in step.rs.
          check crates/rubyrs/src/vm/step.rs         65
          check crates/rubyrs/src/vm/iter.rs         10
          check crates/rubyrs/src/vm/cext.rs          6
          # Bumped 3 → 10 by PR #78 (break/next through ensure).
          # The proper unwinder needs frame/rescue-stack invariant
          # asserts at the loop-transfer entry, landing, and pop
          # points. All ICE-class; the alternative would be silent
          # corruption when the unwinder state machine diverges
          # from the bytecode's assumption.
          check crates/rubyrs/src/vm/raise.rs        10
          check crates/rubyrs/src/vm/lookup.rs        3
          check crates/rubyrs/src/vm/range.rs         1
          check crates/rubyrs/src/vm/string.rs        1
          # The remaining vm/* submodules (array, fileops, gc, hash,
          # numeric, primitive, sprintf, util) have zero panic-class
          # sites; ratcheting them at 0 keeps them honest.
          check crates/rubyrs/src/vm/array.rs         0
          check crates/rubyrs/src/vm/fileops.rs       0
          check crates/rubyrs/src/vm/gc.rs            0
          check crates/rubyrs/src/vm/hash.rs          0
          # Bumped 0 → 5 by PR #66 (require .rb) + PR #78
          # (break/next through ensure). The require/_relative
          # method-return + class_eval unwind path needs the same
          # class_stack / frame invariant asserts that the main
          # dispatch loop has in step.rs. ICE-class.
          check crates/rubyrs/src/vm/kernel.rs        5
          check crates/rubyrs/src/vm/numeric.rs       0
          check crates/rubyrs/src/vm/primitive.rs     0
          check crates/rubyrs/src/vm/sprintf.rs       0
          check crates/rubyrs/src/vm/util.rs          0
          # Bumped 10 → 12 by Spike L3-B: heap.rs gains the
          # `typed_data(id)` and `class_of(id)` accessors that
          # `panic!("ICE: ...")` on slot-type mismatch — same
          # ICE-class invariant pattern as the existing
          # `instance(id)` etc. accessors.
          #
          # Bumped 12 → 13 by F6: the eigenclass accessor on
          # Instance.singleton_class adds one more ICE-class
          # accessor in the same shape.
          check crates/rubyrs/src/heap.rs             15
          # Bumped 3 → 6 by master commits a5d61f1 / cc89211 / 92feabb
          # (multi-write assignment, splat receive, op-assignment forms)
          # which added new ICE-class panics in ast::tr for partially-
          # supported assignment shapes. Master never bumped the budget
          # itself; PR #6 picks the increase up because it merges those
          # commits. All three sites are user-reachable
          # "unsupported AST" paths that ideally become Trap, tracked
          # in docs/PANIC_AUDIT.md.
          #
          # Bumped 6 → 7 by a master commit that added one more
          # ICE-class panic in ast::tr (master shipped red on its
          # own CI without bumping the budget — PR #14 picks up
          # the increase via the merge-result count). Pre-existing
          # master bug, not introduced by this PR.
          check crates/rubyrs/src/ast.rs       8
          check crates/rubyrs/src/lib.rs       1
          # Bumped from 1 → 2 in 8cfe48b ("Add default method arguments")
          # which introduced literal_to_value's ICE panic. The ratchet
          # never went down, just up here. See docs/PANIC_AUDIT.md.
          #
          # Bumped 2 → 6 by PR #78 (break/next through ensure) and
          # PR #81 (ConstantPath op-write family). The compiler
          # gains `loop_next_jumps` / `loop_break_jumps` stack
          # invariants — paired push/pop at each `while` scope plus
          # `last_mut().expect("ICE: just checked")` after the
          # is_empty guard. ICE-class; the guards make the invariant
          # statically true on each access.
          check crates/rubyrs/src/compiler.rs  6
          exit "$fail"

  perf-budget:
    name: Perf budget (peak-RSS ratchet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Build (release)
        # Release-mode is required — the baselines were measured
        # against optimised builds. Debug builds would blow every
        # RSS budget and tell us nothing useful.
        run: cargo build --release -p rubyrs

      - name: Check peak-RSS budgets
        # Runs each workload in perf/baselines.tsv three times,
        # compares MIN peak-RSS to the row's budget, fails if any
        # exceed. Wall-time is collected but not gated here — see
        # perf/README.md for the rationale and ratchet etiquette.
        run: perf/check.sh

  miri:
    name: Miri smoke (Stacked + Tree Borrows)
    # ADR 0013 documents the CURRENT_VM_PTR raw-pointer escape
    # used for cext re-entrance. Runs Miri against every test
    # subset that does NOT touch Prism (vendored C — Miri can't
    # execute foreign code) or `dlopen`, under both default
    # Stacked Borrows and `-Zmiri-tree-borrows`. A regression
    # in the non-cext Vm code would land red here; the cext
    # dispatch path itself is documented as Miri-unverifiable
    # (see ADR 0013's "Miri verification record").
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust nightly + Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src

      - name: Cache cargo + miri sysroot
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-miri-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-miri-

      - name: Miri setup
        run: cargo +nightly miri setup

      - name: Miri (Stacked Borrows) — vm/* unit tests
        run: |
          cargo +nightly miri test --lib -p rubyrs vm::lookup::
          cargo +nightly miri test --lib -p rubyrs vm::gc::
          cargo +nightly miri test --lib -p rubyrs vm::raise::

      - name: Miri (Stacked Borrows) — cext reentrance + FFI tests
        # vm::cext::miri_tests covers the CURRENT_VM_PTR
        # reborrow shape that the actual cext path uses (ADR
        # 0013); rubyrs-cext::safety_negative covers per-fn
        # FFI surface. Neither hits dlopen, so both are
        # Miri-runnable.
        run: |
          cargo +nightly miri test --lib -p rubyrs vm::cext::miri_tests::
          cargo +nightly miri test -p rubyrs-cext --test safety_negative

      - name: Miri (Tree Borrows) — same subset
        env:
          MIRIFLAGS: "-Zmiri-tree-borrows"
        run: |
          cargo +nightly miri test --lib -p rubyrs vm::lookup::
          cargo +nightly miri test --lib -p rubyrs vm::gc::
          cargo +nightly miri test --lib -p rubyrs vm::raise::
          cargo +nightly miri test --lib -p rubyrs vm::cext::miri_tests::
          cargo +nightly miri test -p rubyrs-cext --test safety_negative
