name: Release (crates.io publish via OIDC)

# Publishes the rubyrs family to crates.io using crates.io Trusted
# Publishing (OIDC) -- no long-lived CARGO_REGISTRY_TOKEN secret stored
# in the repo. The GitHub Actions OIDC token is exchanged by
# rust-lang/crates-io-auth-action for a short-lived, crate-scoped
# crates.io token at run time.
#
# ── ONE-TIME SETUP (required before the first run; the workflow file
#    alone does NOT enable OIDC) ──────────────────────────────────────
#
#   1. crates.io trusted publisher, for EACH crate published below
#      (rubyrs-cext, rubyrs). You must already be an owner of the crate
#      -- both already exist on crates.io as 0.1.0, so you can configure
#      them now. Open https://crates.io/crates/<crate>/settings →
#      "Trusted Publishing" → add:
#        - Repository owner:  linyiru
#        - Repository name:   rubyrs
#        - Workflow filename: release.yml      (this file's name, no path)
#        - Environment:       release          (must match `environment:` below)
#
#   2. GitHub environment. Repo → Settings → Environments → new
#      environment named `release`. Add required reviewers here if you
#      want a manual approval gate before any publish actually runs.
#
# ── TRIGGER ──────────────────────────────────────────────────────────
#   Push a SemVer tag `vMAJOR.MINOR.PATCH` (the normal path), or run
#   manually from the Actions tab (workflow_dispatch). On a tag push the
#   tag is checked against the workspace version first.
#
# NOTE on publish order: rubyrs's default `cext` feature pulls in
# rubyrs-cext, so cext must be on the index before rubyrs resolves.
# `cargo publish` waits for each crate to be indexed before returning,
# so the rubyrs step sees the freshly-published cext. The
# independently-versioned engine crates (carmine / rostdown / liquidus)
# are already on crates.io and are NOT part of this family release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read # checkout
  id-token: write # mint the OIDC token for crates-io-auth-action

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    # Forks that push a `v*` tag must not be able to publish.
    if: github.repository == 'linyiru/rubyrs'
    environment: release
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust-toolchain

      - name: Check tag matches workspace version
        if: github.event_name == 'push'
        # Guards against tagging v0.2.0 while Cargo.toml still says 0.1.0
        # (or vice versa): cargo publishes whatever the manifest says,
        # regardless of the tag name, so a mismatch would ship the wrong
        # version under the right tag. Fail loud before any upload.
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          ver="$(grep -m1 -E '^version = ' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag v$tag does not match [workspace.package] version $ver"
            exit 1
          fi
          echo "tag v$tag matches workspace version $ver"

      - name: Mint short-lived crates.io token (OIDC)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish rubyrs-cext
        run: cargo publish --locked -p rubyrs-cext
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Publish rubyrs
        run: cargo publish --locked -p rubyrs
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
