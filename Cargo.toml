# Thin LTO. Required to recover ~7% on the fizzbuzz 1M microbench
# after the vm.rs → vm/ split; cross-module boundaries blocked the
# inlining the single-file version got for free. ~3s extra at
# release-build time, no effect on dev / test builds. Verified
# 2026-05-25 against the perf/baselines.tsv workloads (all under
# budget, metaprog benches slightly improved).
[profile.release]
lto = "thin"

[workspace]
resolver = "3"
members = [
    "crates/rubyrs",
    "crates/rubyrs-cext",
    "crates/rubund",
    "crates/rubyrs-gapscan",
]

# Shared metadata — individual crates pick these up with
# `version.workspace = true`, `edition.workspace = true`, etc.
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/linyiru/rubyrs"
authors = ["rubyrs contributors"]
rust-version = "1.95"

# Centralise shared dependency versions. Crates opt in with
# `<name>.workspace = true` under their `[dependencies]`.
[workspace.dependencies]
ruby-prism = "1.9"
ureq = "2.9"
tar = "0.4"
flate2 = "1.0"
cc = "1"
libloading = "0.8"
# Value-based API only — no derive macros, no proc-macro compile cost.
serde_json = { version = "1", default-features = false, features = ["std"] }
