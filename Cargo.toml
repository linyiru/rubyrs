# Thin LTO. Required to recover ~7% on the fizzbuzz 1M microbench
# after the vm.rs → vm/ split; cross-module boundaries blocked the
# inlining the single-file version got for free. ~3s extra at
# release-build time, no effect on dev / test builds. Verified
# 2026-05-25 against the perf/baselines.tsv workloads (all under
# budget, metaprog benches slightly improved).
[profile.release]
lto = "thin"

# Size-optimized profile for shipping artifacts where cold-start
# wall time tracks binary size. Used by `perf/build_embedder.sh`
# to produce the single-binary `rubyrs-wasm-embed`. Default
# `release` stays the same for everyday throughput-optimized
# builds (rubyrs CLI, tests, perf gates).
#
# Knobs and what each one buys:
#   - opt-level = "z": optimize for binary size (vs default "3"
#     which favours speed). Trades ~5-10% throughput for
#     measurable binary shrink in the wasmtime crate dependency
#     tree.
#   - lto = "fat": cross-crate LTO instead of thin. Catches the
#     dead code that thin LTO misses across the wasmtime crate
#     surface (it's a big crate; thin's per-CGU view leaves
#     stuff behind that whole-program analysis prunes).
#   - codegen-units = 1: single CGU lets the optimizer see the
#     full crate at once. Slower builds, smaller output.
#   - panic = "abort": removes unwinding metadata + landing
#     pads, ~5-15% smaller binaries. The embedder doesn't catch
#     panics anyway — guest traps surface through wasmtime's
#     Result, not Rust panics.
#   - strip = "symbols": removes debug + symbol table after
#     linking. ~15-20% smaller artifact, no runtime impact.
#   - debug = false: no debug info emitted in the first place
#     (strip after-the-fact is more thorough but starts from a
#     bigger object file; both together cover macOS dSYM too).
[profile.release-min]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false

[workspace]
resolver = "3"
members = [
    "crates/rubyrs",
    "crates/rubyrs-cext",
    "crates/rubund",
    "crates/rubyrs-gapscan",
    "crates/rubyrs-spec-extract",
    "crates/rubyrs-wasm-timer",
    "crates/rubyrs-wasm-embed",
]

# Shared metadata — individual crates pick these up with
# `version.workspace = true`, `edition.workspace = true`, etc.
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/linyiru/rubyrs"
authors = ["rubyrs contributors"]
rust-version = "1.95"

# Centralise shared dependency versions. Crates opt in with
# `<name>.workspace = true` under their `[dependencies]`.
[workspace.dependencies]
ruby-prism = "1.9"
ureq = "2.9"
tar = "0.4"
flate2 = "1.0"
cc = "1"
libloading = "0.8"
# Value-based API only — no derive macros, no proc-macro compile cost.
serde_json = { version = "1", default-features = false, features = ["std"] }
