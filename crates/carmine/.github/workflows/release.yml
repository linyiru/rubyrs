# Publish carmine to crates.io via Trusted Publishing (OIDC) — no API token stored.
#
# One-time setup on crates.io (carmine → Settings → Trusted Publishing →
# GitHub Actions):
#   Repository:  momiji-rs/carmine
#   Workflow:    release.yml
#   Environment: release        (matches `environment:` on the job below)
# crates.io then mints a short-lived token for the OIDC exchange; no secret is
# configured in GitHub.
#
# Triggered by pushing a version tag (e.g. `git tag v0.3.0 && git push --tags`).
# Bump `version` in Cargo.toml to match the tag before pushing.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write   # required for the crates.io OIDC token exchange
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify before publish
        run: cargo test --all-targets
      # Exchanges the GitHub OIDC token for a short-lived crates.io token.
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: cargo publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
