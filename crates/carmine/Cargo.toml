[package]
name = "carmine"
description = "A rouge-compatible syntax-highlighting engine: runs rule tables extracted from Ruby's rouge lexers and emits byte-identical HTML"
version = "0.3.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["syntax-highlighting", "lexer", "rouge", "highlighting"]
categories = ["text-processing", "parser-implementations"]

[dependencies]
fancy-regex = "0.18"
# Linear-first engine: most rouge rules are plain
# keyword/literal/char-class shapes that regex-automata's meta
# engine matches in linear time WITH anchored-at-pos search and
# full-haystack \b context; only lookaround/backref rules stay on
# the fancy backtracker (which also can't anchor, so it pays an
# O(n) scan per miss).
regex-automata = "0.4"
serde_json.workspace = true
