[package]
name = "carmine"
description = "A rouge-compatible syntax-highlighting engine: runs rule tables extracted from Ruby's rouge lexers and emits byte-identical HTML"
version = "0.3.0"
# Self-contained (no workspace inheritance) so this crate publishes from its
# own repo, github.com/momiji-rs/carmine, unchanged from the rubyrs monorepo.
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/momiji-rs/carmine"
authors = ["momiji-rs"]
rust-version = "1.95"
readme = "README.md"
keywords = ["syntax-highlighting", "lexer", "rouge", "highlighting"]
categories = ["text-processing", "parser-implementations"]

[dependencies]
fancy-regex = "0.18"
# Linear-first engine: most rouge rules are plain
# keyword/literal/char-class shapes that regex-automata's meta
# engine matches in linear time WITH anchored-at-pos search and
# full-haystack \b context; only lookaround/backref rules stay on
# the fancy backtracker (which also can't anchor, so it pays an
# O(n) scan per miss).
regex-automata = "0.4"
# Value-based API only — no derive macros, no proc-macro compile cost.
serde_json = { version = "1", default-features = false, features = ["std"] }
