[package]
name = "rubyrs-gapscan"
description = "Scans Ruby codebases for AST features rubyrs cannot translate, to quantify and prioritise the subset gap."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "rubyrs-gapscan"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
ruby-prism.workspace = true
rubyrs = { path = "../rubyrs" }
serde_json.workspace = true
