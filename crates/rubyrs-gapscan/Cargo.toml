[package]
name = "rubyrs-gapscan"
description = "Scans Ruby codebases for AST features rubyrs cannot translate, to quantify and prioritise the subset gap."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["ruby", "ast", "coverage", "prism", "rubyrs"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "rubyrs-gapscan"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
ruby-prism.workspace = true
rubyrs = { path = "../rubyrs", version = "0.2.0" }
serde_json.workspace = true
