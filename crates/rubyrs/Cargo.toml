[package]
name = "rubyrs"
description = "A tiny Ruby-subset interpreter in Rust, built on top of Prism"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["ruby", "interpreter", "prism", "dsl", "embedded"]
categories = ["compilers", "wasm", "command-line-utilities"]

# Feature flags (PoC for ADR 0015 concentric architecture).
#
# `cext` is the first tier-boundary made opt-in: the CRuby-shape C
# ABI for hosting `require`'d C extensions. Pulling it out:
#   - drops the `rubyrs-cext` + `libloading` dependencies
#   - drops the 162 `#[used]` static cext function pointers from
#     the binary's dynamic symbol table
#   - drops the `mod cext;` and `cext_*` code paths in the VM
#
# Not yet gated by the feature (deliberate scope — followup PR):
#   - `--export-dynamic` linker arg on ELF targets (still emitted
#     by build.rs unconditionally; harmless when cext is off
#     because there are no `rb_*` symbols left to export, but
#     pedantically still drags).
#
# Wasm32-wasi targets cannot enable `cext` — `dlopen` is
# unavailable and the cext path cannot succeed. `build.rs` panics
# loudly if `--features cext --target wasm32-wasi*` is requested,
# rather than silently producing a stub-only binary that
# advertises capability the target does not deliver.
#
# Default features keep cext on so embedders and the CLI binary
# behave identically to pre-PoC. Build without:
#     cargo build -p rubyrs --no-default-features
# to get the size-minimised, sandbox-friendlier core.
#
# (This is one tier boundary. ADR 0015 envisions language /
# stdlib / mri-compat tiers as well — they require larger surgery
# and are explicitly out of scope for this PoC.)
[features]
jit-native = ["dep:cranelift-jit", "dep:cranelift-codegen", "dep:cranelift-frontend", "dep:cranelift-module"]
default = ["cext", "regex", "bignum", "std-sink", "preamble-cache"]
# EXPERIMENT: swap the system allocator for mimalloc (a fast
# small-object allocator). The VM is allocation-heavy, so the system
# malloc shows up large in profiles. Opt-in: `--features mimalloc`.
mimalloc = ["dep:mimalloc"]
# Bootsnap-style preamble bytecode cache: Runtime::new's
# parse+AST+compile of the ~176 KB always-on preamble (~2.7 ms of
# the ~5 ms CLI cold start) is serialized to a host-provided cache
# directory on first run and restored on subsequent runs. Execution
# still happens live (class/method tables are rebuilt every run) — only
# the pure source→bytecode pipeline is cached. Capability-gated per
# ADR 0017: library Runtimes never touch the filesystem unless the
# host sets `Config::preamble_cache_dir`; the CLI binary opts in.
preamble-cache = ["dep:serde", "dep:postcard"]
# Alternative global allocator for RSS-sensitive embedders.
# Measured 2026-06-10 on the Jekyll 1k benches (ABAB x3 vs
# mimalloc): wall +3-4% slower, peak RSS −8-9% (liquid-1k
# 69.3 → 62.8 MB). The CLI keeps mimalloc — wall is the headline
# there and RSS already beats CRuby — but embedders running many
# Runtimes under container memory quotas may prefer this trade.
# HISTORICAL CAVEAT (2026-07-04): those numbers were taken against
# segment-cache-era mimalloc; the "mimalloc costs RSS" posture is
# stale — but the replacement story is PLATFORM-SPLIT. mimalloc
# v3.3.2 (crate 0.1.52) re-measure: on macOS arm64 peak RSS is now
# LOWER than the system allocator (−0.65~−2.36% on hello /
# require-200-class / gc-churn) alongside the wall wins; on
# Linux/glibc 2.43 x86_64 the SAME version DOUBLES peak RSS
# (hello 11.4→23.6 MB, churn 19.4→38.2 MB; 1 GiB arena_reserve +
# eager commit) while keeping the wall wins (hello −10%, require
# −28%). MIMALLOC_ARENA_RESERVE=0 recovers ~half the Linux RSS but
# forfeits the wall win. Linux container-quota deployments should
# measure before enabling. See docs/BENCHMARKS.md "Standard
# measurement feature set". The jemalloc-vs-mimalloc-v2 delta
# above is retained as history; re-measure before choosing
# jemalloc for RSS reasons.
# Mutually exclusive with `mimalloc` at the global_allocator
# level (mimalloc wins if both are enabled).
jemalloc = ["dep:tikv-jemallocator"]
cext = ["dep:rubyrs-cext", "dep:libloading"]
# `bignum` is the third tier boundary (PoC Phase A per ADR 0018's
# BigInt placement decision). With this feature off:
#   - the `num-bigint` dependency disappears (~80-120 KB save
#     estimate; measured at merge time)
#   - `Value::BigInt`, `HeapObj::BigInt`, `Op::LoadBigInt`, and
#     the integer-literal overflow → BigInt promotion path all
#     cfg out; arithmetic falls back to two's-complement
#     `wrapping_*` (wraps on overflow rather than promoting; not
#     saturating)
#   - script-visible: integer literals beyond i64 (e.g.
#     `9_223_372_036_854_775_808`) saturate to `i64::MAX` at the
#     AST layer, and `+`/`-`/`*`/`/`/`%` results that overflow i64
#     wrap modulo 2^64 instead of promoting to arbitrary precision
# Phase A surface (today): `+`, `-`, `*`, `/`, `%`, comparison,
# `to_s`, `inspect`, `class`. Phase B will add `**` (which still
# saturates today, gated on the `primitive_call &mut Vm` plumbing
# tracked separately), bit ops, unary `-@`/`+@`, `abs`, and Float
# interop.
# Integer is Tier-1 semantics in CRuby (Fixnum + Bignum unified),
# so BigInt lives in Tier 1 (will move to `rubyrs-core` in
# Phase 1 of ADR 0018). The default keeps it on so CLI / embed
# behaviour matches CRuby for arithmetic.
bignum = ["dep:num-bigint", "dep:num-integer", "dep:num-traits"]
# `regex` is the second tier boundary (PoC for ADR 0015 / spec'd
# by ADR 0017). With this feature off:
#   - the `regex` crate dependency disappears (~300 KB save)
#   - `/pattern/` literals raise a clear Trap from the AST
#     translator with a "regex feature not enabled" message
#   - `Value::Regex`, `Op::LoadRegex`, `Expr::RegexLit`, and the
#     `Vm::regex_cache` field all cfg out
#   - every dispatch arm that matches `Value::Regex` (Regex#match,
#     String#sub/gsub/match?/scan with regex args, =~, ===) is
#     cfg-gated and unreachable in this build
# Per ADR 0017's Rule 3, regex belongs in Tier 2 (this feature).
# The default keeps it on so today's CLI / embedder behaviour
# stays identical to pre-PoC.
regex = ["dep:regex", "dep:fancy-regex", "dep:regex-syntax"]
# Tier 3 stdlib vendor bridge (per ADR 0017 row 125). With this
# feature off, the lenient stdlib stub path (`is_stdlib_stub_name`)
# stays a pure "feature-absent surface": `require 'pathname'`
# materialises the constant shell so `defined?(Pathname)` returns
# "constant", but any call (`Pathname.new(...)`) raises
# NoMethodError. With this feature on, the same require path
# additionally loads an embedded pure-Ruby implementation
# (`crates/rubyrs/src/stdlib_vendor/<name>.rb`) on the running
# Vm, so the module's CRuby-compatible behaviour becomes
# available to scripts. The full-features build is the only
# place Tier 1 core grows a Tier 3 surface; the default build
# stays minimal per ADR 0017.
stdlib = ["dep:flate2"]
# `sass` enables in-process SCSS/Sass compilation via the pure-Rust
# `grass` crate (ADR 0019-style Tier-3 battery — a Rust crate behind
# a feature, surfaced to Ruby). With it OFF, `RubyrsSass.compile`
# raises a clear "feature absent" error and the jekyll-sass-converter
# shim's `convert` fails loudly (plain, non-SCSS sites still build).
# Kept out of `default` so the base + wasm builds don't pay grass's
# ~2-3 MB. The backend lives behind a `SassBackend` seam (src/sass.rs)
# so a future native rubyrs-sass impl can replace grass without
# touching the Ruby/Jekyll side.
sass = ["dep:grass"]
# `std-sink` enables the `StdSink` adapter that bridges
# `std::io::Write` to the `OutputSink` trait. Default-on
# because the facade crate's `Runtime::set_stdout` public API
# accepts `Box<dyn std::io::Write>` (a `std::*` type by
# definition); without this feature, that adapter is absent
# and embedders must construct `OutputSink` impls directly.
# When `rubyrs-core` (ADR 0018 Phase 1) ships, this feature
# moves to the facade crate and `rubyrs-core` becomes
# `#![no_std]` with `OutputSink` only.
std-sink = []
# `trace-startup` instruments the CLI binary's `main()` with phase
# timestamps (entry → args → env → runtime → eval → done) printed to
# stderr as `trace-startup\t<label>\t<microseconds>us`. Used by
# `perf/wasm_breakdown.sh` to break down the cold-start budget into
# wasmtime-init / wasi-init / rubyrs-startup / script-eval buckets so
# we know which knob to turn next. Zero-cost when off: the `Trace`
# struct is zero-sized and `at()` is an empty `#[inline(always)]`.
trace-startup = []
# `ic-stats` instruments the per-call-site inline cache with hit /
# miss counters, exposed via the public `Runtime::ic_stats()` API
# and dumped to stderr by the CLI when `RUBYRS_IC_STATS=1`. Used
# to validate the polymorphic IC (currently `IC_WAYS = 5`,
# widened from 4 in PR #185) against real workloads: if a hot
# dispatch site shows a low hit rate, the call-site is
# megamorphic past `IC_WAYS` and `next_way` round-robin eviction
# is thrashing — knob for whether widening further pays off.
# Zero-cost when off: `IcStats` is a ZST and `record_hit` /
# `record_miss` compile to nothing.
ic-stats = []
# `_fiber` enables Tier-2 cooperative concurrency primitives
# (`Fiber.new`, `Fiber.yield`, `Fiber#resume`, `Fiber.current`,
# `Fiber#alive?`). Per ADR 0017 §"Out of Tier 1" Fiber is Tier 2
# (`language` feature group); ADR 0019 v3 places it in the
# `rubyrs-language` crate-split with `_fiber` as its feature flag.
# This wire-up is the pre-split form (feature flag inside
# `rubyrs` itself) — when `rubyrs-language` extracts in ADR 0018
# Phase 1, the gate moves with it.
#
# Default OFF — matches ADR 0017's "deferred until a real use
# case" guidance; the first real consumer is `_http_server`'s
# A3β async-streaming path (ADR 0023). Embedders wanting
# streaming responses opt in to both features. Tier 1 builds
# (no Fiber) keep working unchanged: any `Fiber` constant
# reference raises NameError, matching the bignum-off /
# regex-off shape.
#
# Cost when on: new `FiberObject` heap variant + ~11 Vm fields
# touched by the snapshot swap. No per-request perf impact when
# no Fiber is allocated; allocating a Fiber pays one heap slot
# + the snapshot size (mostly empty Vecs that grow on yield).
_fiber = []
# `_json_native` — Rust-side accelerator for the pure-Ruby JSON
# canon (`src/stdlib_vendor/json.rb`). When enabled, the canon's
# `JSON.parse` / `JSON.generate` detect the registered host fns
# (`__rubyrs_json_native_*`) and route through serde_json,
# returning Ruby values built directly via `heap.alloc`. Per ADR
# 0019 Rule 6 (pure-Ruby canon + behaviour-equivalent
# accelerator), the accelerator MUST produce the same Ruby
# values + same emitted bytes for the deterministic subset; the
# pure canon stays the spec, the native path stays the fast
# path. Opt-in only — the pure canon already works, the
# accelerator is for hot loops (Rack JSON responses, parsing
# request bodies, …) where bytecode-level dispatch overhead
# would otherwise dominate.
_json_native = ["dep:serde_json", "dep:serde", "dep:memchr"]
# `_rouge_native` — carmine-backed accelerator for the rouge gem's
# RegexLexer. After `require "rouge"` a shim patches `lex` + the HTML
# formatter to route supported lexers through the native engine
# (byte-identical output); unsupported lexers / rules fall back to the
# pure-Ruby gem per lexer or per call. See src/rouge_native.rs.
_rouge_native = ["dep:carmine", "dep:serde_json"]
# `_kramdown_native` — rostdown-backed accelerator for kramdown under
# Jekyll. After `require "kramdown-parser-gfm"` a shim patches
# `Kramdown::JekyllDocument` to route Jekyll-default-option documents
# through the native renderer (byte-identical output); out-of-subset
# documents and non-default options fall back to the pure-Ruby gem per
# document. See src/kramdown_native.rs.
_kramdown_native = ["dep:rostdown"]
# `_yaml_native` — native fast path for the blessed-reimpl YAML
# front-matter loader (stdlib_vendor/yaml.rb, ADR 0026). A 1:1 Rust
# translation of the SAME parser; yaml.rb detects the host fn and
# routes parse_document through it, rescuing back to pure Ruby for
# inputs the translation declines. Zero new dependencies.
# `_encoding_full` — ADR 0020 Tier 2: the encoding registry behind
# `EncodingTag::Other(u8)` plus real transcoding for `String#encode`.
# v1 ships ISO-8859-1 (hand-written — byte↔codepoint is the identity,
# so no table dependency); the WHATWG-backed encodings (Shift_JIS,
# EUC-JP, GBK, Big5, KOI8-R, Windows-1252, Latin-9) arrive with the
# `encoding_rs` dep in a follow-up, gated on CRuby differential
# probes per the amended ADR. NOT in cli-defaults; `everything`
# picks it up.
_encoding_full = ["dep:encoding_rs", "dep:unicode-normalization", "dep:unicode-segmentation"]
# `_bcrypt` — pure-Rust bcrypt (EksBlowfish) battery backing the bcrypt
# gem's two C-ext entry points (`BCrypt::Engine.__bc_salt` / `__bc_crypt`).
# No external crate (the algorithm is a self-contained port of
# crypt_blowfish.c); makes `require "bcrypt"` load + run on rubyrs.
_bcrypt = []
# `_prism_native` — the RuboCop parser-engine port (ADR 0036 slices /
# the ADR 0034 rubocop campaign): the Rust bridge that makes
# `require "prism"` work and RuboCop's `parser_prism` engine run
# natively. Covers prism_native (serialize-parse host fns over the
# always-linked prism C lib), prism_materialize + prism_node_specs
# (wire→Ruby-object AST materialization + the generated NodeSpec
# tables), prism_wq (native `Prism::Translation::Parser#tokenize`:
# lexer/builder/compiler ports), and commdrv (native Commissioner
# cop-walk driver). No new crate deps — it is pure code weight:
# ~380 KB of .text / ~0.3-0.4 MB base RSS that the default
# (non-RuboCop) build shouldn't carry, which is why it is gated
# like `jit-native`/`jit_tier2` rather than always-compiled.
# In `cli-defaults` (the shipped CLI keeps `require "prism"` +
# the RuboCop accelerators working); lib `default` stays lean.
# With the feature OFF, the prism gem's `require "prism/prism"`
# raises a clear feature-absent LoadError naming this flag (the
# gem has no pure-Ruby parser to degrade to). Probed 2026-07 on
# the rubocop-1.88.0 stack: rubocop-ast 1.49 hard-requires prism,
# so `require "rubocop"` fails the same loud way — the RuboCop
# workload needs this feature, full stop.
_prism_native = []
# `_oj` — pure-Ruby shim for the oj gem's C extension (`oj/oj`),
# routing `Oj.dump` / `Oj.load` to rubyrs's JSON (= oj's `:compat`
# mode = standard JSON). Correct for plain-data dump/load — the common
# "fast JSON drop-in" use; oj's default `:object`-mode quirks (symbols
# as ":sym", custom-object marshalling) are NOT modelled (documented).
# No Rust code — just an embedded preamble + the require stub.
_oj = []
# `dep:regex` (not the `regex` VM feature): the front-matter host fn
# compiles Jekyll's YAML_FRONT_MATTER_REGEXP natively. Pulling the dep
# alone keeps the `--no-default-features --features _yaml_native`
# matrix slot compiling without dragging in the whole regex dispatch
# tier.
_yaml_native = ["dep:regex"]
# `_liquid_native` — liquidus-backed accelerator for Liquid rendering
# under Jekyll. After `require "jekyll"` a shim patches
# Jekyll::LiquidRenderer::File to compile templates through the native
# engine (whole-template decline) and resolve each template's
# statically-known variable paths once per render. See
# src/liquid_native.rs.
_liquid_native = ["dep:liquidus"]
# `_sqlite` enables the SQLite battery per ADR 0027.
# Pulls in `rusqlite` (bundled libsqlite3 — ~2 MB compiled, no
# system libsqlite3 needed) + `lru` (per-connection prepared-
# statement cache). Ruby-facing `SQLite3::Database` + the
# 25-class exception hierarchy live in
# `src/preamble/sqlite_database.rb`; host fns in
# `crates/rubyrs/src/sqlite.rs`. Per ADR 0019 v3 Rule 3
# batteries are individually opt-in; per ADR 0019 Rule 8 the
# Ruby-side load form is `require "rubyrs/sqlite"` to avoid
# shadowing the MRI `sqlite3` gem.
_sqlite = ["dep:rusqlite", "dep:lru"]
# `_socket` — outbound TCP-client battery per ADR 0028. Blocking
# `std::net` (no async runtime → no class-`g` deviation), `libc`
# only for a couple of errno refinements. Backs the pure-Ruby
# `TCPSocket` veneer + `Net::HTTP`. NOT in cli-defaults — outbound
# network is the strongest sandbox-default-off capability.
_socket = ["dep:libc"]
# `_openssl` — TLS-client slice (rustls) backing Net::HTTP https per
# ADR 0029. Depends on `_socket` (Rule 5 flat intra-Tier-3 dep — it
# takes a connected TcpStream from the socket battery to layer TLS).
_openssl = ["_socket", "dep:rustls", "dep:webpki-roots", "dep:rustls-pki-types"]
# `cli-defaults` — Bun-class fresh-install bundle per ADR 0019
# v3 line 313. Discharges the "`cargo install rubyrs` Just Works"
# promise the menu was sized around. `_sqlite` + `_http_server`
# are the load-bearing batteries; `stdlib` brings the pure-Ruby
# canon (json/active_support_lite/…). Total ≤ 40 MB stripped
# per ADR 0019 v3's binary budget. `mimalloc` is in the CLI bundle
# (not bare `default`) because it's a global-allocator wall win the
# `cargo install rubyrs` user should get by default; the minimal
# `default` tier (embedders) stays allocator-neutral. Re-measured
# 2026-06-10 after the lazy-regex RSS work: jekyll liquid-1k wall
# −8.5% (0.82 → 0.75s, level with CRuby) for +1.3% peak RSS
# (67.5 → 68.4MB, still under CRuby's 79.7) — the old "~9% RSS"
# cost shrank because lazy regex removed most of the allocation
# volume mimalloc's segment cache used to hold.
# `_prism_native` rides in cli-defaults (2026-07: the RuboCop
# parser-engine port was cfg-gated out of lib `default` as the
# ticketed ~380 KB .text clawback; the installed CLI keeps the
# `require "prism"` / RuboCop-accelerator behaviour it always had).
cli-defaults = ["stdlib", "_sqlite", "_http_server", "sass", "mimalloc", "_prism_native"]
# `everything` — kitchen sink for embedders who want every
# available battery pre-wired. ADR 0019 v3 line 314's "Bun-
# class CLI / Edge runtime" target. ≤ 150 MB stripped.
everything = ["cli-defaults", "_json_native", "_fiber", "_encoding_full", "_socket", "_openssl", "_kramdown_native", "_rouge_native"]
# `_http_server` enables the inbound HTTP server battery per
# ADR 0022 v4. Pulls in hyper + tokio (current-thread runtime)
# + http-body-util + bytes for the wire-protocol side; the
# Ruby-facing `Rubyrs::HttpServer` class plus Rack SPEC env
# hash construction live in `crates/rubyrs/src/http_server.rs`.
# Opt-in only; not in `default` because the dep tree adds
# ~12-18 MB stripped on top of the Tier 1 build. Per ADR 0019
# v3 Rule 3, batteries are individually opt-in. Phase H1
# (this PoC) ships HTTP/1.1 + buffered body in/out only;
# H2/H3/TLS land as separate batteries.
_http_server = [
    "dep:hyper",
    "dep:hyper-util",
    "dep:tokio",
    "dep:http-body-util",
    "dep:bytes",
    "dep:http",
    "dep:socket2",
    "dep:libc",
]

[dependencies]
ruby-prism.workspace = true
# `version` alongside `path`: rubyrs is publishable, so a version-less
# path dep is a `*` requirement — rejected by deny.toml's
# `[bans] wildcards = "deny"` and unpublishable anyway. Keep in sync
# with the workspace version.
rubyrs-jit = { path = "../rubyrs-jit", version = "0.2.0" }
cranelift-jit = { version = "0.133", optional = true }
cranelift-codegen = { version = "0.133", optional = true }
cranelift-frontend = { version = "0.133", optional = true }
cranelift-module = { version = "0.133", optional = true }
smallvec = { version = "1", features = ["union"] }
mimalloc = { version = "0.1", optional = true, default-features = false }
tikv-jemallocator = { version = "0.6", optional = true }
# `_encoding_full`'s transcoding backend for the multi-byte + WHATWG
# single-byte encodings (Windows-1252/-31J, ISO-8859-15, KOI8-R,
# EUC-JP, GBK, Big5). ISO-8859-1 stays hand-written (identity map;
# the WHATWG world maps the latin1 LABEL to windows-1252 — exactly
# the trap the amended ADR 0020 says to route around). Where WHATWG
# and CRuby disagree (strict Shift_JIS vs windows-31j semantics),
# the registry ships the CRuby encoding that MATCHES the WHATWG
# table (Windows-31J) and declines the other (documented).
encoding_rs = { version = "0.8", optional = true }
# UAX#29 grapheme segmentation (`String#each_grapheme_cluster`) and
# UCD normalization (`String#unicode_normalize` NFC/NFD/NFKC/NFKD) for
# non-ASCII input — gated with the rest of the Unicode surface behind
# `_encoding_full`.
unicode-segmentation = { version = "1", optional = true }
unicode-normalization = { version = "0.1", optional = true }
# `flate2` (pure-Rust miniz_oxide backend — wasm-safe) backs the
# `stdlib` Zlib surface: Zlib::Deflate/Inflate + GzipWriter/Reader,
# which rack's Deflater (gzip responses) and Static (serve .gz) need.
flate2 = { version = "1", optional = true }
regex = { version = "1", optional = true }
# `regex-syntax` is already in the tree as `regex`'s own parser —
# depending on it directly (same 0.8 line, so it dedupes to one
# build) lets `compile_with_flags` VALIDATE patterns at Regexp
# construction time without building the engine. The engine build
# (NFA + lazy-DFA setup, ~30-100KB per pattern) is deferred to
# first use: on the Jekyll require chain only ~11% of constructed
# regexes are ever matched, so eager building wasted ~16MB RSS.
regex-syntax = { version = "0.8", optional = true }
# `fancy-regex` is the lookaround / backreference fallback engine.
# rubyrs uses `regex` as the primary engine (linear time,
# ReDoS-immune by construction); fancy-regex is only consulted
# when `regex::Regex::new` fails on syntax the linear engine
# rejects (typically `(?=...)` lookahead). Internally fancy-
# regex itself delegates simple subpatterns back to `regex` —
# so the cold path is still mostly the same engine, only with
# a backtracking NFA stitched in for the unsupported features.
# Bundled into the `regex` feature so embedders don't need to
# think about a second knob; the dep is gated on `regex` too.
fancy-regex = { version = "0.18", optional = true }
# `_rouge_native` battery: the carmine rouge-compatible highlighting
# engine (workspace sibling, also published to crates.io).
carmine = { path = "../carmine", version = "0.3.0", optional = true }
# `_kramdown_native` battery: the rostdown kramdown-compatible Markdown
# renderer (workspace sibling).
rostdown = { path = "../rostdown", version = "0.1.0", optional = true }
# `_liquid_native` battery: the liquidus Liquid-compatible template
# engine (workspace sibling).
liquidus = { path = "../liquidus", version = "0.1.0", optional = true }
# Optional via the `bignum` feature. With bignum off, num_bigint is not
# pulled in. ADR 0018 Phase 1 will switch this to `default-features =
# false` when rubyrs-core extracts (num-bigint's `std` is opt-out).
num-bigint = { version = "0.4", optional = true }
# `sass` battery: pure-Rust SCSS/Sass compiler. `default-features =
# false` drops grass's CLI deps (clap/anstream/…) — we only use the
# library entry point `grass::from_string`.
grass = { version = "0.13", default-features = false, optional = true }
# `_http_server` battery dependencies (ADR 0022 v4). All
# optional behind the feature flag.
hyper = { version = "1", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio", "server"], optional = true }
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "signal", "time", "macros"], optional = true }
http-body-util = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }
http = { version = "1", optional = true }
# Stage 7: SO_REUSEPORT listener binds for pre-fork
# multi-core scaling. tokio + std::net only expose
# SO_REUSEADDR; the kernel-hash-LB SO_REUSEPORT path
# requires raw setsockopt, which socket2 wraps portably.
socket2 = { version = "0.5", features = ["all"], optional = true }
# `_json_native` battery: optional via the feature flag. Pulled
# in only when an embedder builds with `--features _json_native`
# so the default Tier-1 binary stays serde_json-free.
serde = { version = "1", optional = true, features = ["derive", "rc"] }
# Compact serde format for the preamble bytecode cache
# (`preamble-cache` feature). default-features = false drops the
# heapless/COBS embedded paths; `alloc` enables Vec-backed
# encode/decode, the only mode the cache uses.
postcard = { version = "1", optional = true, default-features = false, features = ["alloc"] }
# `float_roundtrip`: serde_json's default float parse is fast but
# NOT correctly rounded — probed 1-ULP-off vs CRuby (which uses
# fast_float, correctly rounded) on tie/boundary decimals like
# 2.2250738585072011e-308. Byte-parity on re-generate requires the
# exact same f64 bits CRuby gets.
serde_json = { version = "1", optional = true, features = ["preserve_order", "float_roundtrip"] }
# json_native's exponent-fence pre-scan: a SIMD memchr2(e,E) sweep
# short-circuits the whole scan on exponent-free payloads (pure
# number arrays, ID-in-string docs) ~10x cheaper than a stride
# walk. Already in the dependency graph transitively (regex
# engines); direct-dep adds no new code.
memchr = { version = "2", optional = true }
# `_sqlite` battery deps. rusqlite + bundled SQLite C source
# (~2 MB compiled). ADR 0027 §1 pins to 0.39 for supply-chain
# determinism (`= 0.39` not `^0.39`). `lru` backs the per-
# connection prepared-statement cache (ADR 0027 §4). Bumped
# 0.12 → 0.16 to clear RUSTSEC-2026-0002 (the 0.12 `IterMut`
# violates Stacked Borrows; advisory fix landed in 0.16.3).
# Our usage is `new`/`cap`/`get_mut`/`put` only — all
# API-stable across the bump.
rusqlite = { version = "=0.39", features = ["bundled"], optional = true }
lru = { version = "0.16", optional = true }
# Stage 7d: libc::fork + waitpid for pre-fork supervisor.
# Unix-only inside the host fn (cfg(target_family = "unix")).
# libc is preferred over nix here — minimal API surface
# (3 syscalls), no extra dep tree.
libc = { version = "0.2", optional = true }
# `_openssl` battery (ADR 0029): rustls TLS-client slice for Net::HTTP
# https. `ring` provider (no C toolchain / NASM), bundled webpki-roots
# (no system-cert dep). `tls12` on for real-world endpoint compat.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
webpki-roots = { version = "0.26", optional = true }
rustls-pki-types = { version = "1", optional = true }
# Brings `num_integer::Integer::div_rem` into scope so we can do
# one division step (returning quotient + remainder) instead of
# separate `/` and `%` divisions inside `Integer#digits`'s loop.
# Already a transitive dep of num-bigint (re-pinned here so we
# can name it directly). Gated on `bignum` to match.
num-integer = { version = "0.1", optional = true, default-features = false }
# Brings `num_traits::FromPrimitive::from_f64` into scope so the
# BigInt × Float `==` arm can do lossless conversion (truncates
# integral f64 → exact BigInt; bottoms out for NaN/inf). Already
# a transitive dep of num-bigint (re-pinned here so we can name
# it directly). Gated on `bignum` to match.
num-traits = { version = "0.2", optional = true }
# Optional via the `cext` feature. With cext off, neither dep is
# pulled into the build.
rubyrs-cext = { path = "../rubyrs-cext", version = "0.2.0", optional = true }

# `libloading` is only meaningful where there's a dynamic loader.
# wasm32-wasip1 has no `dlopen` (build.rs and the wasi-only
# `cext_require` alt in vm.rs handle that). With the cext feature
# off, we don't need libloading on any target.
[target.'cfg(not(target_os = "wasi"))'.dependencies]
libloading = { workspace = true, optional = true }

# `stacker` grows the native stack on demand inside the AST→IR
# translator (`ast::tr`). `tr` is one large function that recurses
# structurally over the Prism AST; in unoptimised (debug) builds each
# frame carries every arm's locals, costing several KB per nesting
# level. The always-on preamble is compiled through this path at
# `Runtime::new`, so a deeply nested AST could overflow a small thread
# stack — notably the 1 MB default *main-thread* stack on Windows,
# where debug embedders overflowed at startup while release (smaller
# frames) ran fine. See issue #356. Native-only: wasm has a
# link-time-fixed stack and psm can't switch stacks there, so `ast::tr`
# falls back to plain recursion under `cfg(target_family = "wasm")`.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
stacker = "0.1"

# ADR 0025 Phase 1 — POSIX signal handling for `Config::install_signal_handler`.
# `signal-hook::flag::register` is documented async-signal-safe (atomic store
# only); it's the minimal-surface choice over hand-rolling `sigaction`.
# Unix-only — Windows uses `SetConsoleCtrlHandler` (deferred per ADR 0025
# v3 Risk #2). Unconditional within the unix target so the default-feature
# build picks it up; the install path itself is still capability-gated via
# `Config::install_signal_handler: bool` (default false), so a library
# embedder that never opts in pays nothing at runtime.
[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"
# Kernel#fork / Process.waitpid (minitest's fork-exit-status
# tests): unix-only production dep — the same 3-syscall surface
# the _http_server pre-fork supervisor already justified.
libc = "0.2"

[build-dependencies]
cc.workspace = true

# ADR 0025 Phase 1: dev-only libc for the SIGINT smoke test.
# `libc::kill(getpid(), SIGINT)` is the standard way for a
# unit test to drive its own signal infrastructure without
# spawning a subprocess. Production builds don't need libc
# outside the `_http_server` feature; this dev dep keeps the
# Tier 1 binary lean.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

# M27 D — `tests/diff_framework.rs` needs JSON manifest parsing
# (serde + serde_json) and the same regex engine the rubyrs lib
# uses for transcript normalisation. All three are already in the
# workspace transitive closure (regex via the `regex` default
# feature; serde via num-bigint / hyper); pinned here so the test
# binary can name them directly without an opt-in shim.
[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
# Self-signed cert generation for the `_openssl` battery integration
# test's loopback TLS server (tests/openssl_battery.rs). Dev-only.
rcgen = "0.13"
