[package]
name = "rubyrs"
description = "A tiny Ruby-subset interpreter in Rust, built on top of Prism"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["ruby", "interpreter", "prism", "dsl", "embedded"]
categories = ["compilers", "wasm", "command-line-utilities"]

# Feature flags (PoC for ADR 0015 concentric architecture).
#
# `cext` is the first tier-boundary made opt-in: the CRuby-shape C
# ABI for hosting `require`'d C extensions. Pulling it out:
#   - drops the `rubyrs-cext` + `libloading` dependencies
#   - drops the 162 `#[used]` static cext function pointers from
#     the binary's dynamic symbol table
#   - drops the `mod cext;` and `cext_*` code paths in the VM
#
# Not yet gated by the feature (deliberate scope — followup PR):
#   - `--export-dynamic` linker arg on ELF targets (still emitted
#     by build.rs unconditionally; harmless when cext is off
#     because there are no `rb_*` symbols left to export, but
#     pedantically still drags).
#
# Wasm32-wasi targets cannot enable `cext` — `dlopen` is
# unavailable and the cext path cannot succeed. `build.rs` panics
# loudly if `--features cext --target wasm32-wasi*` is requested,
# rather than silently producing a stub-only binary that
# advertises capability the target does not deliver.
#
# Default features keep cext on so embedders and the CLI binary
# behave identically to pre-PoC. Build without:
#     cargo build -p rubyrs --no-default-features
# to get the size-minimised, sandbox-friendlier core.
#
# (This is one tier boundary. ADR 0015 envisions language /
# stdlib / mri-compat tiers as well — they require larger surgery
# and are explicitly out of scope for this PoC.)
[features]
default = ["cext", "regex"]
cext = ["dep:rubyrs-cext", "dep:libloading"]
# `regex` is the second tier boundary (PoC for ADR 0015 / spec'd
# by ADR 0017). With this feature off:
#   - the `regex` crate dependency disappears (~300 KB save)
#   - `/pattern/` literals raise a clear Trap from the AST
#     translator with a "regex feature not enabled" message
#   - `Value::Regex`, `Op::LoadRegex`, `Expr::RegexLit`, and the
#     `Vm::regex_cache` field all cfg out
#   - every dispatch arm that matches `Value::Regex` (Regex#match,
#     String#sub/gsub/match?/scan with regex args, =~, ===) is
#     cfg-gated and unreachable in this build
# Per ADR 0017's Rule 3, regex belongs in Tier 2 (this feature).
# The default keeps it on so today's CLI / embedder behaviour
# stays identical to pre-PoC.
regex = ["dep:regex"]
# Tier 3 stdlib vendor bridge (per ADR 0017 row 125). With this
# feature off, the lenient stdlib stub path (`is_stdlib_stub_name`)
# stays a pure "feature-absent surface": `require 'pathname'`
# materialises the constant shell so `defined?(Pathname)` returns
# "constant", but any call (`Pathname.new(...)`) raises
# NoMethodError. With this feature on, the same require path
# additionally loads an embedded pure-Ruby implementation
# (`crates/rubyrs/src/stdlib_vendor/<name>.rb`) on the running
# Vm, so the module's CRuby-compatible behaviour becomes
# available to scripts. The full-features build is the only
# place Tier 1 core grows a Tier 3 surface; the default build
# stays minimal per ADR 0017.
stdlib = []

[dependencies]
ruby-prism.workspace = true
regex = { version = "1", optional = true }
# Optional via the `cext` feature. With cext off, neither dep is
# pulled into the build.
rubyrs-cext = { path = "../rubyrs-cext", version = "0.1.0", optional = true }

# `libloading` is only meaningful where there's a dynamic loader.
# wasm32-wasip1 has no `dlopen` (build.rs and the wasi-only
# `cext_require` alt in vm.rs handle that). With the cext feature
# off, we don't need libloading on any target.
[target.'cfg(not(target_os = "wasi"))'.dependencies]
libloading = { workspace = true, optional = true }

[build-dependencies]
cc.workspace = true
