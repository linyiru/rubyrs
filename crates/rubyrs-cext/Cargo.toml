[package]
name = "rubyrs-cext"
description = "CRuby-shape C ABI for hosting C extensions inside rubyrs (spike: Level 0)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["ruby", "ffi", "cext", "abi", "rubyrs"]
categories = ["api-bindings", "external-ffi-bindings"]

[lib]
name = "rubyrs_cext"
# rlib only. We deliberately do NOT produce a cdylib: that would
# give us two physically distinct copies of `STATE` (one inside
# the rubyrs binary's statically-linked image, one inside the
# .dylib that C extensions also linked against), and they'd never
# see each other's `enter`/`leave`.
#
# Instead, the rubyrs binary exports the `rb_*` symbols from its
# own image (see crates/rubyrs/build.rs), and C extensions link
# with `-undefined dynamic_lookup` (macOS) / `--unresolved-
# symbols=ignore-all` (Linux), resolving against the host process
# at dlopen time. Single image, single `STATE`.
crate-type = ["rlib"]

[build-dependencies]
# Compiles c/setjmp_shim.c for Spike L3-A (rb_raise / longjmp
# across the FFI boundary). See build.rs for why the shim is in C.
cc.workspace = true

[dependencies]
