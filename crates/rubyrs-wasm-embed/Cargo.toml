[package]
name = "rubyrs-wasm-embed"
description = "PoC minimal embedder — links wasmtime as a library and runs rubyrs.cwasm directly, skipping the wasmtime CLI's argv parsing and config plumbing. Spike artifact for measuring how much of wasmtime CLI's ~5 ms init is its own framing vs the wasmtime runtime core."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "rubyrs-wasm-embed"
path = "src/main.rs"
# `build.rs` runs `Engine::precompile_module` to AOT-compile the
# wizer'd rubyrs .wasm into a cwasm, which `main.rs` then embeds
# via `include_bytes!`. Pinning the same wasmtime version AND
# feature set here and in [dependencies] is load-bearing:
#
# - cwasm format is version-stamped; runtime Engine rejects
#   wrong-version artifacts outright.
# - cwasm ALSO carries the feature config used at compile time;
#   if the precompile path enabled `gc` but the runtime feature
#   set lacks it, deserialize fails at runtime with
#   "module was compiled with GC however GC is disabled in the
#   host". Resolver 3 keeps build-deps and target-deps' feature
#   sets isolated, so the two declarations must match by hand.
#
# `cranelift` is the one feature we need HERE that we don't need
# in `[dependencies]`: build.rs runs the compiler;
# `Module::deserialize` in main.rs only needs the runtime side.
# `=45.0.3` (exact) rather than `"45.0"` (compatible-with caret
# semantics, accepting 45.0.x). CI's `.github/workflows/ci.yml`
# pins the wasmtime CLI to v45.0.3 with a sha256 over that exact
# tarball; the embedder's build-side wasmtime is what determines
# the cwasm format the runtime side has to deserialize. Letting
# cargo drift to a different 45.0.x patch while CI's CLI stays put
# would mean local-vs-CI cwasm comparisons drift silently — and
# any deserialize-failure surface area we worked to close with
# the feature-match plumbing above re-opens at the patch level.
[build-dependencies]
wasmtime = { version = "=45.0.3", default-features = false, features = [
    "runtime",
    "std",
    "cranelift",
] }

[dependencies]
# Match the version `perf/wasm_check.sh` already validates in CI
# (.github/workflows/ci.yml installs wasmtime v45.0.3 from the
# release tarball with a pinned sha256). cwasm format
# compatibility requires BOTH:
#   - matching wasmtime version (cwasm is version-stamped;
#     `Module::deserialize` rejects mismatches outright), AND
#   - matching feature set (cwasm encodes the compiler-side
#     feature config; runtime deserialize fails with messages like
#     "module was compiled with GC however GC is disabled in the
#     host" when the runtime feature set is smaller than the
#     compile-time set).
# Trimmed features below mean this embedder can NOT deserialize
# cwasm produced by the full-feature `wasmtime compile` CLI even
# when the version matches. `RUBYRS_CWASM=<path>` runtime override
# still works, but only with cwasm built using the same trimmed
# config (e.g. via `wasmtime::Engine::precompile_module` in this
# crate's `build.rs`).
#
# Feature trimming: wasmtime's defaults include heavy options the
# embedder doesn't use (cranelift compiler, cache layer, wat
# parser, component model, async/threads, GC types, profiling,
# debug builtins, coredump). We deserialize an AOT-compiled
# cwasm and run `_start` — only `runtime` + `std` are needed.
# This matches wasmtime-wasi 45's own dep config exactly (see
# its Cargo.toml). Local PoC shrinks the embedder binary from
# ~19 MB (defaults) to ~7 MB (90% wasmtime crate code stripped).
# `=45.0.3` exact pin matches the build-dependency above and
# `.github/workflows/ci.yml`'s CLI tarball pin — see the
# [build-dependencies] block for the full rationale.
wasmtime = { version = "=45.0.3", default-features = false, features = [
    "runtime",
    "std",
] }
wasmtime-wasi = "=45.0.3"
