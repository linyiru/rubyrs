[package]
name = "rubyrs-wasm-embed"
description = "PoC minimal embedder — links wasmtime as a library and runs rubyrs.cwasm directly, skipping the wasmtime CLI's argv parsing and config plumbing. Spike artifact for measuring how much of wasmtime CLI's ~5 ms init is its own framing vs the wasmtime runtime core."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "rubyrs-wasm-embed"
path = "src/main.rs"
# `build.rs` runs `Engine::precompile_module` to AOT-compile the
# wizer'd rubyrs .wasm into a cwasm, which `main.rs` then embeds
# via `include_bytes!`. Pinning the same wasmtime version AND
# feature set here and in [dependencies] is load-bearing:
#
# - cwasm format is version-stamped; runtime Engine rejects
#   wrong-version artifacts outright.
# - cwasm ALSO carries the feature config used at compile time;
#   if the precompile path enabled `gc` but the runtime feature
#   set lacks it, deserialize fails at runtime with
#   "module was compiled with GC however GC is disabled in the
#   host". Resolver 3 keeps build-deps and target-deps' feature
#   sets isolated, so the two declarations must match by hand.
#
# `cranelift` is the one feature we need HERE that we don't need
# in `[dependencies]`: build.rs runs the compiler;
# `Module::deserialize` in main.rs only needs the runtime side.
[build-dependencies]
wasmtime = { version = "45.0", default-features = false, features = [
    "runtime",
    "std",
    "cranelift",
] }

[dependencies]
# Match the version `perf/wasm_check.sh` already validates in CI
# (.github/workflows/ci.yml installs wasmtime v45.0.0 from the
# release tarball with a pinned sha256). Using the same version
# keeps cwasm produced by the CLI deserialize-able by this
# embedder — wasmtime's serialized format is version-stamped and
# `Module::deserialize` rejects mismatches.
#
# Feature trimming: wasmtime's defaults include heavy options the
# embedder doesn't use (cranelift compiler, cache layer, wat
# parser, component model, async/threads, GC types, profiling,
# debug builtins, coredump). We deserialize an AOT-compiled
# cwasm and run `_start` — only `runtime` + `std` are needed.
# This matches wasmtime-wasi 45's own dep config exactly (see
# its Cargo.toml). Local PoC shrinks the embedder binary from
# ~19 MB (defaults) to ~7 MB (90% wasmtime crate code stripped).
wasmtime = { version = "45.0", default-features = false, features = [
    "runtime",
    "std",
] }
wasmtime-wasi = "45.0"
