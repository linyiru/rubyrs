[package]
name = "rubund"
description = "Zero-copy Gemfile.lock parser library, with a placeholder CLI ahead of full bundle commands."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["ruby", "bundler", "gemfile", "lockfile", "parser"]
categories = ["parser-implementations", "command-line-utilities"]

[[bin]]
name = "rubund"
path = "src/main.rs"

# rubyrs is workspace-internal. The path+version dep below is
# for the bridge examples that evaluate real Gemfile DSL under
# the embed-API hardening features (`Config::allow_filesystem_io`,
# `Config::allowed_paths`, `Config::load_paths`, panic→Trap
# boundary; see rubyrs PRs #268 / #279 / #288 / #302).
#
# Why `path + version` (and not just `path`): Cargo rejects
# `cargo publish` on a crate with a path-only dep. The
# version is the registry pin that publishes will use;
# workspace builds prefer the path (because the path is
# present), so local development is unaffected. When rubyrs
# ships on crates.io as 0.1.x, `cargo publish -p rubund`
# becomes a no-code-change action; until then it fails with
# "no matching package `rubyrs` found" which is the right
# failure mode to surface (clearer than "path-only deps not
# allowed").
[dev-dependencies]
rubyrs = { path = "../rubyrs", version = "0.2.0" }
ureq.workspace = true
tar.workspace = true
flate2.workspace = true
