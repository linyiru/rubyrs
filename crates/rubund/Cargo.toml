[package]
name = "rubund"
description = "Zero-copy Gemfile.lock parser library, with a placeholder CLI ahead of full bundle commands."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["ruby", "bundler", "gemfile", "lockfile", "parser"]
categories = ["parser-implementations", "command-line-utilities"]

[[bin]]
name = "rubund"
path = "src/main.rs"

# rubyrs is workspace-internal. The path-dep below is for the
# bridge examples that evaluate real Gemfile DSL under the
# embed-API hardening features (`Config::allow_filesystem_io`,
# `Config::allowed_paths`, `Config::load_paths`, panic→Trap
# boundary; see rubyrs PRs #268 / #279 / #288 / #302). The dep
# was previously lifted because `cargo publish` rejects
# unresolved path deps and rubyrs isn't on crates.io yet;
# restored as a dev-dependency so the bridge stays buildable
# in-workspace. When rubyrs ships, switch this to the
# `path = "..." + version = "..."` shape so
# `cargo publish -p rubund` resolves the version-pinned form
# against the registry (Cargo prefers the registry version at
# publish time and the local path during workspace builds).
[dev-dependencies]
rubyrs = { path = "../rubyrs" }
ureq.workspace = true
tar.workspace = true
flate2.workspace = true
