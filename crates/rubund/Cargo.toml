[package]
name = "rubund"
description = "Zero-copy Gemfile.lock parser library, with a placeholder CLI ahead of full bundle commands."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["ruby", "bundler", "gemfile", "lockfile", "parser"]
categories = ["parser-implementations", "command-line-utilities"]

[[bin]]
name = "rubund"
path = "src/main.rs"

# The `rubyrs` dep that drove the CLI's old `--demo` flag — and two
# examples that bridge into a real Ruby interpreter for Gemfile DSL
# evaluation — is currently lifted. `rubyrs` is not yet on crates.io
# (its name is still being finalised), and `cargo publish` rejects
# unresolved path deps. The bridge code lives at
# `examples-rubyrs-deferred/` and returns once `rubyrs` (or its
# successor name) ships.

[dev-dependencies]
ureq.workspace = true
tar.workspace = true
flate2.workspace = true
